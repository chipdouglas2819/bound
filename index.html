function drawHUD(){
  // wave label flash — appears briefly at wave 2 / wave 3 transitions to mark the threshold
  if (game.waveLabelTimer > 0 && game.wave >= 2){
    const t = game.waveLabelTimer;
    // ramp in over first 0.3s then hold then fade out — peak alpha around mid-life
    const phaseIn = Math.min(1, (1.8 - t) / 0.3);
    const phaseOut = Math.min(1, t / 0.6);
    const alpha = Math.max(0, Math.min(phaseIn, phaseOut));
    ctx.textAlign = 'center';
    ctx.fillStyle = `rgba(250,204,21,${0.85 * alpha})`;
    ctx.font = '300 italic 64px "Fraunces",serif';
    ctx.shadowColor = '#facc15';
    ctx.shadowBlur = 24 * alpha;
    ctx.fillText('WAVE  ' + game.wave, CX, CY - 40);
    ctx.shadowBlur = 0;
    ctx.fillStyle = `rgba(232,235,242,${0.55 * alpha})`;
    ctx.font = '300 12px "IBM Plex Mono",monospace';
    const subtitle = game.wave === 2 ? '— FIELD HAZARDS ENTER —' : '— SHIELDED FOES ENTER —';
    ctx.fillText(subtitle, CX, CY - 8);
  }

  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(232,235,242,0.5)';
  ctx.font = '300 10px "IBM Plex Mono",monospace';
  ctx.fillText('TIME', CX, 36);
  const tl = game.timeLeft;
  const danger = tl < 8;
  ctx.fillStyle = danger ? '#ff9a3f' : '#e8ebf2';
  ctx.font = `300 italic 48px "Fraunces",serif`;
  ctx.fillText(tl.toFixed(1), CX, 86);

  // essence (top-left) — only after first pickup this run
  if (game.runEssence > 0){
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(232,235,242,0.5)';
    ctx.font = '300 10px "IBM Plex Mono",monospace';
    ctx.fillText('ESSENCE', 28, 36);
    ctx.fillStyle = '#5ee9ff';
    ctx.font = '400 22px "IBM Plex Mono",monospace';
    ctx.fillText(String(game.runEssence).padStart(2,'0'), 28, 60);
  }

  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(232,235,242,0.5)';
  ctx.font = '300 10px "IBM Plex Mono",monospace';
  ctx.fillText('SCORE', W-28, 36);
  ctx.fillStyle = '#e8ebf2';
  ctx.font = '400 22px "IBM Plex Mono",monospace';
  ctx.fillText(String(game.runScore).padStart(3,'0'), W-28, 60);

  // combo multiplier (only when active or just broken)
  const cb = game.combo;
  if (cb.tier > 0 || cb.breakFlash > 0){
    let label, color, baseSize;
    if (cb.breakFlash > 0){
      label = '×1.0';
      const bf = cb.breakFlash;
      color = `rgba(255,107,138,${0.4 + 0.6*bf})`;
      baseSize = 16 + 8*bf;
    } else {
      label = '×' + cb.mult.toFixed(1);
      if (cb.tier >= 3) color = '#ffd24a';
      else if (cb.tier >= 2) color = '#5ee9ff';
      else color = 'rgba(186,230,253,0.9)';
      baseSize = 14 + cb.tier*2 + cb.tierFlash*8;
    }
    ctx.fillStyle = color;
    ctx.font = `400 italic ${baseSize}px "Fraunces",serif`;
    ctx.fillText(label, W-28, 86);
  }

  // gold orb boost indicator — visible when active, around the player area
  const p = game.player;
  if (p && p.goldBoost > 0){
    ctx.textAlign = 'center';
    const boostFrac = p.goldBoost / 3;
    ctx.fillStyle = `rgba(250,204,21,${0.4 + 0.6*boostFrac})`;
    ctx.font = '400 italic 16px "Fraunces",serif';
    ctx.fillText('×3 BOOST  ' + p.goldBoost.toFixed(1) + 's', CX, 110);
  }
}

function drawMenu(){
  const ownedAny = Object.values(meta.passives || {}).some(v => v > 0);
  const showLoadout = ownedAny;

  // central icon
  const pulse = 6 + 2*Math.sin(game.t*2);
  const iconY = showLoadout ? CY - 80 : CY - 10;
  ctx.shadowColor = '#5ee9ff';
  ctx.shadowBlur = 26;
  ctx.strokeStyle = '#5ee9ff';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.arc(CX, iconY, 18+pulse*0.2, 0, TAU);
  ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(CX, iconY, 8, 0, TAU);
  ctx.fill();

  ctx.textAlign = 'center';
  ctx.fillStyle = '#e8ebf2';
  ctx.font = '300 italic 96px "Fraunces",serif';
  ctx.fillText('Bound', CX, iconY - 60);
  ctx.fillStyle = 'rgba(232,235,242,0.5)';
  ctx.font = '300 11px "IBM Plex Mono",monospace';
  ctx.fillText('A · DODGE · ROGUELIKE', CX, iconY - 26);

  ctx.fillStyle = '#5ee9ff';
  ctx.font = '300 italic 20px "Fraunces",serif';
  const essBanked = meta.totalEssence || 0;
  if (essBanked > 0){
    ctx.fillText(formatScore(meta.totalScore) + ' score · ' + essBanked + ' essence banked', CX, iconY + 60);
  } else {
    ctx.fillText(formatScore(meta.totalScore) + ' score banked', CX, iconY + 60);
  }

  // prestige rank indicator — always visible after first ascend, hidden otherwise to keep menu clean for new players
  if ((meta.prestige || 0) > 0){
    const pulse = 0.85 + 0.15 * Math.sin(game.t * 1.4);
    ctx.fillStyle = `rgba(250,204,21,${pulse})`;
    ctx.font = '300 italic 13px "Fraunces",serif';
    ctx.fillText('▲  PRESTIGE  RANK  ' + meta.prestige + '  ·  ' + (meta.prestigeMult || 1).toFixed(2) + 'x  score', CX, iconY + 82);
  }

  const narrow = W < 540;
  let by;
  if (narrow){
    const bw = Math.min(280, W-48), bh = 48;
    by = iconY + 96;
    drawButton(CX-bw/2, by, bw, bh, 'BEGIN  RUN', beginRun, true);
    drawButton(CX-bw/2, by + bh + 12, bw, bh, 'UPGRADES', openShop, false);
    by = by + bh*2 + 12;
  } else {
    const bw = 200, bh = 48, gap = 20;
    const totalW = bw*2 + gap;
    const baseX = CX - totalW/2;
    by = iconY + 100;
    drawButton(baseX, by, bw, bh, 'BEGIN  RUN', beginRun, true);
    drawButton(baseX+bw+gap, by, bw, bh, 'UPGRADES', openShop, false);
    by = by + bh;
  }

  // mode toggle — only shown when at least one extended mode is unlocked.
  // Single tap-to-cycle line keeps the menu uncluttered while still surfacing the choice.
  if ((meta.prestige || 0) >= 6){
    const tw = narrow ? Math.min(280, W-48) : 280;
    const th = 30;
    const tx = CX - tw/2;
    const ty = by + 14;
    const cur = meta.preferredMode || 30;
    const hov = mx>=tx && mx<=tx+tw && my>=ty && my<=ty+th;
    const pulse = 0.6 + 0.4 * Math.sin(game.t * 1.4);
    ctx.fillStyle = hov ? `rgba(250,204,21,${0.10 + 0.06*pulse})` : `rgba(250,204,21,${0.05})`;
    roundRect(tx, ty, tw, th, 4);
    ctx.fill();
    ctx.strokeStyle = `rgba(250,204,21,${hov ? pulse : 0.4 + 0.2*pulse})`;
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillStyle = 'rgba(232,235,242,0.55)';
    ctx.font = '300 9px "IBM Plex Mono",monospace';
    ctx.textAlign = 'left';
    ctx.fillText('MODE', tx + 14, ty + 19);
    ctx.fillStyle = '#facc15';
    ctx.font = '500 11px "IBM Plex Mono",monospace';
    ctx.textAlign = 'center';
    ctx.fillText(modeLabel(cur), CX, ty + 19);
    ctx.fillStyle = `rgba(250,204,21,${0.5 + 0.4*pulse})`;
    ctx.font = '300 italic 14px "Fraunces",serif';
    ctx.textAlign = 'right';
    ctx.fillText('›', tx + tw - 14, ty + 21);
    game.buttonHits.push({x:tx, y:ty, w:tw, h:th, action:cycleMode});
    by = ty + th;
  }

  // ascension-available banner — first-time prestige unlock cue. Tappable, opens shop.
  // Auto-dismisses once ascended (canAscend gates on prestige still being 0).
  if (canAscend() && (meta.prestige || 0) === 0){
    const bannerY = by + 16;
    const bannerW = narrow ? Math.min(280, W-48) : 360;
    const bannerH = 30;
    const bx = CX - bannerW/2;
    const pulse = 0.55 + 0.25 * Math.sin(game.t * 2.4);
    ctx.fillStyle = `rgba(250,204,21,${0.08 + 0.05*pulse})`;
    roundRect(bx, bannerY, bannerW, bannerH, 4);
    ctx.fill();
    ctx.strokeStyle = `rgba(250,204,21,${pulse})`;
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillStyle = `rgba(250,204,21,${0.7 + 0.3*pulse})`;
    ctx.font = '500 11px "IBM Plex Mono",monospace';
    ctx.textAlign = 'center';
    ctx.fillText('▲  ASCENSION  AVAILABLE  ·  visit  shop', CX, bannerY + 19);
    game.buttonHits.push({x:bx, y:bannerY, w:bannerW, h:bannerH, action:openShop});
  }

  // loadout — three slots showing equipped passives
  if (showLoadout){
    drawLoadout(by + 28, narrow);
  }

  // best time / hint at the bottom
  const bottomY = showLoadout ? by + 130 : by + 60;
  if (meta.bestTime > 0){
    ctx.fillStyle = 'rgba(232,235,242,0.4)';
    ctx.font = '300 11px "IBM Plex Mono",monospace';
    ctx.fillText('best  descent  ·  ' + meta.bestTime.toFixed(1) + 's   over  ' + meta.runs + '  runs', CX, bottomY);
  } else {
    ctx.fillStyle = 'rgba(232,235,242,0.4)';
    ctx.font = '300 11px "IBM Plex Mono",monospace';
    ctx.fillText('survive  ·  thirty  ·  seconds', CX, bottomY);
  }

  ctx.fillStyle = 'rgba(232,235,242,0.3)';
  ctx.font = '300 10px "IBM Plex Mono",monospace';
  ctx.fillText('keys · WASD · arrows  /  touch + drag', CX, H - 30);

  // gear icon (top-right) — opens settings
  drawGearIcon();

  // overlays — picker and settings (settings drawn after picker so it can stack)
  if (shopUI.pickerOpen) drawSlotPicker(narrow);
  if (shopUI.settingsOpen) drawSettings(narrow);
}

function drawLoadout(baseY, narrow){
  // header
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(232,235,242,0.45)';
  ctx.font = '300 10px "IBM Plex Mono",monospace';
  ctx.fillText('— LOADOUT —', CX, baseY);

  const slotW = narrow ? 90 : 110;
  const slotH = 56;
  const gap = 10;
  const totalW = slotW*MAX_SLOTS + gap*(MAX_SLOTS-1);
  const startX = CX - totalW/2;
  const slotY = baseY + 14;

  const equipped = meta.equipped || [];
  for (let i=0;i<MAX_SLOTS;i++){
    const x = startX + i*(slotW+gap);
    const id = equipped[i];
    const passive = id ? PASSIVE_BY_ID[id] : null;
    const hov = mx>=x && mx<=x+slotW && my>=slotY && my<=slotY+slotH;

    if (passive){
      // filled slot
      ctx.fillStyle = hov ? 'rgba(94,233,255,0.16)' : 'rgba(94,233,255,0.06)';
      ctx.strokeStyle = hov ? '#5ee9ff' : 'rgba(94,233,255,0.5)';
      ctx.lineWidth = 1.2;
    } else {
      ctx.fillStyle = hov ? 'rgba(232,235,242,0.05)' : 'rgba(15,20,35,0.5)';
      ctx.strokeStyle = hov ? 'rgba(232,235,242,0.4)' : 'rgba(232,235,242,0.18)';
      ctx.lineWidth = 1;
      ctx.setLineDash([4,4]);
    }
    roundRect(x, slotY, slotW, slotH, 4);
    ctx.fill();
    ctx.stroke();
    ctx.setLineDash([]);

    if (passive){
      // symbol top
      ctx.fillStyle = '#5ee9ff';
      ctx.font = '300 22px "Fraunces",serif';
      ctx.fillText(passive.symbol, x + slotW/2, slotY + 26);
      // title
      ctx.fillStyle = '#e8ebf2';
      ctx.font = '500 9px "IBM Plex Mono",monospace';
      ctx.fillText(passive.title, x + slotW/2, slotY + 44);
    } else {
      ctx.fillStyle = 'rgba(232,235,242,0.3)';
      ctx.font = '300 10px "IBM Plex Mono",monospace';
      ctx.fillText('empty', x + slotW/2, slotY + slotH/2 + 4);
    }

    game.buttonHits.push({x, y:slotY, w:slotW, h:slotH, action:()=>openSlotPicker(i)});
  }
}

function openSlotPicker(slot){
  shopUI.pickerOpen = true;
  shopUI.pickerSlot = slot;
  shopUI.pickerScroll = 0;
}
function closeSlotPicker(){
  shopUI.pickerOpen = false;
  shopUI.pickerSlot = -1;
}

function drawSlotPicker(narrow){
  // dim everything
  ctx.fillStyle = 'rgba(6,8,16,0.85)';
  ctx.fillRect(0,0,W,H);

  // clear other hit areas to prevent click-through to background
  game.buttonHits.length = 0;

  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(232,235,242,0.55)';
  ctx.font = '300 11px "IBM Plex Mono",monospace';
  ctx.fillText('— SLOT  ' + (shopUI.pickerSlot+1) + '  /  ' + MAX_SLOTS + ' —', CX, narrow ? 50 : 80);
  ctx.fillStyle = '#e8ebf2';
  ctx.font = `300 italic ${narrow ? 28 : 36}px "Fraunces",serif`;
  ctx.fillText('Choose passive.', CX, narrow ? 86 : 122);

  const rowH = narrow ? 50 : 56;
  const rowGap = 8;
  const rowW = Math.min(360, W - 48);
  const rowX = CX - rowW/2;

  const equipped = meta.equipped || [];
  const currentId = equipped[shopUI.pickerSlot];

  // build list of rows to draw
  const rows = [];
  if (currentId){
    rows.push({ kind:'unequip' });
  }
  for (const p of PASSIVES){
    rows.push({ kind:'passive', passive: p });
  }

  // scroll bounds
  const headerEnd = narrow ? 110 : 150;
  const closeY = H - 70;
  const areaTop = headerEnd;
  const areaBottom = closeY - 14;
  const areaH = Math.max(80, areaBottom - areaTop);
  const contentH = rows.length * (rowH + rowGap) - rowGap;
  shopUI.pickerMaxScroll = Math.max(0, contentH - areaH);
  shopUI.pickerScroll = clamp(shopUI.pickerScroll, 0, shopUI.pickerMaxScroll);

  // clip rows area
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, areaTop, W, areaH);
  ctx.clip();

  let y = areaTop + 4 - shopUI.pickerScroll;
  for (const r of rows){
    if (r.kind === 'unequip'){
      drawPickerRow(rowX, y, rowW, rowH, null, true, ()=>{
        unequipSlot(shopUI.pickerSlot);
        closeSlotPicker();
      }, false, false, areaTop, areaBottom);
    } else {
      const p = r.passive;
      const lvl = passiveLevel(p.id);
      const owned = lvl > 0;
      const isCurrent = currentId === p.id;
      const equippedElsewhere = !isCurrent && equipped.includes(p.id);
      drawPickerRow(rowX, y, rowW, rowH, p, owned, ()=>{
        if (!owned) return;
        equipInSlot(shopUI.pickerSlot, p.id);
        closeSlotPicker();
      }, isCurrent, equippedElsewhere, areaTop, areaBottom);
    }
    y += rowH + rowGap;
  }

  ctx.restore();

  // top/bottom fade hint when content overflows
  if (shopUI.pickerMaxScroll > 0){
    if (shopUI.pickerScroll > 2){
      const grd = ctx.createLinearGradient(0, areaTop, 0, areaTop + 24);
      grd.addColorStop(0, 'rgba(6,8,16,0.85)');
      grd.addColorStop(1, 'rgba(6,8,16,0)');
      ctx.fillStyle = grd;
      ctx.fillRect(0, areaTop, W, 24);
    }
    if (shopUI.pickerScroll < shopUI.pickerMaxScroll - 2){
      const grd = ctx.createLinearGradient(0, areaBottom - 24, 0, areaBottom);
      grd.addColorStop(0, 'rgba(6,8,16,0)');
      grd.addColorStop(1, 'rgba(6,8,16,0.85)');
      ctx.fillStyle = grd;
      ctx.fillRect(0, areaBottom - 24, W, 24);
    }
    const trackH = areaH - 16;
    const thumbH = Math.max(28, trackH * (areaH / contentH));
    const thumbY = areaTop + 8 + (trackH - thumbH) * (shopUI.pickerScroll / shopUI.pickerMaxScroll);
    ctx.fillStyle = 'rgba(232,235,242,0.08)';
    ctx.fillRect(W - 7, areaTop + 8, 2, trackH);
    ctx.fillStyle = 'rgba(94,233,255,0.55)';
    ctx.fillRect(W - 7, thumbY, 2, thumbH);
  }

  // close button
  const closeW = 200, closeH = 40;
  drawButton(CX-closeW/2, closeY, closeW, closeH, 'CLOSE', closeSlotPicker, false);
}

function drawPickerRow(x, y, w, h, passive, enabled, action, isCurrent, equippedElsewhere, areaTop, areaBottom){
  const hov = enabled && mx>=x && mx<=x+w && my>=y && my<=y+h;

  if (isCurrent){
    ctx.fillStyle = 'rgba(94,233,255,0.14)';
    ctx.strokeStyle = '#5ee9ff';
  } else if (hov){
    ctx.fillStyle = 'rgba(94,233,255,0.08)';
    ctx.strokeStyle = 'rgba(94,233,255,0.6)';
  } else if (enabled){
    ctx.fillStyle = 'rgba(15,20,35,0.85)';
    ctx.strokeStyle = 'rgba(94,233,255,0.25)';
  } else {
    ctx.fillStyle = 'rgba(15,20,35,0.4)';
    ctx.strokeStyle = 'rgba(232,235,242,0.1)';
  }
  ctx.lineWidth = (isCurrent || hov) ? 1.4 : 1;
  roundRect(x, y, w, h, 3);
  ctx.fill();
  ctx.stroke();

  ctx.textAlign = 'left';
  if (!passive){
    // unequip row
    ctx.fillStyle = 'rgba(255,107,138,0.7)';
    ctx.font = '300 18px "Fraunces",serif';
    ctx.fillText('×', x + 18, y + 35);
    ctx.fillStyle = '#e8ebf2';
    ctx.font = '500 12px "IBM Plex Mono",monospace';
    ctx.fillText('UNEQUIP', x + 42, y + 24);
    ctx.fillStyle = 'rgba(232,235,242,0.5)';
    ctx.font = '300 10px "IBM Plex Mono",monospace';
    ctx.fillText('clear this slot', x + 42, y + 40);
  } else {
    const lvl = passiveLevel(passive.id);
    const owned = lvl > 0;
    ctx.fillStyle = owned ? '#5ee9ff' : 'rgba(232,235,242,0.25)';
    ctx.font = '300 22px "Fraunces",serif';
    ctx.fillText(passive.symbol, x + 18, y + 36);

    ctx.fillStyle = owned ? '#e8ebf2' : 'rgba(232,235,242,0.3)';
    ctx.font = '500 12px "IBM Plex Mono",monospace';
    ctx.fillText(passive.title, x + 50, y + 22);

    ctx.fillStyle = owned ? 'rgba(232,235,242,0.6)' : 'rgba(232,235,242,0.25)';
    ctx.font = '300 10px "IBM Plex Mono",monospace';
    if (owned){
      ctx.fillText(passive.desc(lvl), x + 50, y + 40);
    } else {
      ctx.fillText('not yet acquired', x + 50, y + 40);
    }

    // status tag right side
    ctx.textAlign = 'right';
    if (isCurrent){
      ctx.fillStyle = '#5ee9ff';
      ctx.font = '500 9px "IBM Plex Mono",monospace';
      ctx.fillText('EQUIPPED', x + w - 16, y + 22);
    } else if (equippedElsewhere){
      ctx.fillStyle = 'rgba(255,210,74,0.7)';
      ctx.font = '500 9px "IBM Plex Mono",monospace';
      ctx.fillText('SWAP', x + w - 16, y + 22);
    }
    // level pips
    if (owned){
      ctx.textAlign = 'right';
      const max = passive.costs.length;
      const pipR = 3, pipG = 5;
      const pipsW = max*pipR*2 + (max-1)*pipG;
      let px = x + w - 16 - pipsW + pipR;
      const py = y + 40;
      for (let i=0;i<max;i++){
        const filled = i < lvl;
        ctx.fillStyle = filled ? '#5ee9ff' : 'rgba(232,235,242,0.18)';
        ctx.beginPath();
        ctx.arc(px, py, pipR, 0, TAU);
        ctx.fill();
        px += pipR*2 + pipG;
      }
    }
    ctx.textAlign = 'left';
  }

  if (enabled){
    const top = areaTop !== undefined ? Math.max(y, areaTop) : y;
    const bot = areaBottom !== undefined ? Math.min(y+h, areaBottom) : (y+h);
    const visH = bot - top;
    if (visH >= 24){
      game.buttonHits.push({x, y:top, w, h:visH, action});
    }
  }
}

// ===== settings overlay =====
function drawSettings(narrow){
  // dim background
  ctx.fillStyle = 'rgba(6,8,16,0.88)';
  ctx.fillRect(0,0,W,H);
  // wipe button hits — only settings interactions count
  game.buttonHits.length = 0;

  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(232,235,242,0.55)';
  ctx.font = '300 11px "IBM Plex Mono",monospace';
  ctx.fillText('— SETTINGS —', CX, narrow ? 50 : 80);
  ctx.fillStyle = '#e8ebf2';
  ctx.font = `300 italic ${narrow ? 32 : 44}px "Fraunces",serif`;
  ctx.fillText('Settings.', CX, narrow ? 92 : 132);

  // Section: DATA (reset)
  const panelW = Math.min(380, W - 36);
  const panelX = CX - panelW/2;
  let panelY = narrow ? 130 : 180;
  panelY = drawSettingsSection(panelX, panelY, panelW, 'DATA', (x, y, w) => {
    return drawResetRow(x, y, w, narrow);
  }, narrow);

  // Close button at bottom
  const closeW = narrow ? Math.min(280, W-48) : 220;
  const closeY = H - 70;
  drawButton(CX - closeW/2, closeY, closeW, 44, 'CLOSE', closeSettings, false);

  if (game.shopMsgTimer > 0){
    ctx.textAlign = 'center';
    ctx.fillStyle = `rgba(94,233,255,${clamp(game.shopMsgTimer,0,1)})`;
    ctx.font = '300 12px "IBM Plex Mono",monospace';
    ctx.fillText(game.shopMsg, CX, closeY - 18);
  }
}

// renders a labeled section frame, calls inner() to draw the contents,
// returns the y where the section ended
function drawSettingsSection(x, y, w, label, inner, narrow){
  // label
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(94,233,255,0.55)';
  ctx.font = '500 9px "IBM Plex Mono",monospace';
  ctx.fillText(label, x + 4, y);
  // inner content area
  const contentY = y + 8;
  const innerH = inner(x, contentY, w);
  // light divider at the bottom
  const endY = contentY + innerH;
  ctx.strokeStyle = 'rgba(232,235,242,0.08)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(x, endY + 6);
  ctx.lineTo(x + w, endY + 6);
  ctx.stroke();
  return endY + 6;
}

function drawResetRow(x, y, w, narrow){
  const rowH = narrow ? 60 : 64;
  ctx.fillStyle = 'rgba(15,20,35,0.4)';
  ctx.strokeStyle = 'rgba(232,235,242,0.10)';
  ctx.lineWidth = 1;
  roundRect(x, y, w, rowH, 4);
  ctx.fill();
  ctx.stroke();

  ctx.textAlign = 'left';
  ctx.fillStyle = '#e8ebf2';
  ctx.font = '500 12px "IBM Plex Mono",monospace';
  ctx.fillText('Reset progression', x + 14, y + 22);
  ctx.fillStyle = 'rgba(232,235,242,0.55)';
  ctx.font = '300 10px "IBM Plex Mono",monospace';
  ctx.fillText('wipes all upgrades, score, and essence', x + 14, y + 42);

  // button on the right — uses the existing 2-tap confirm flow
  const bw = 110, bh = 32;
  const bx = x + w - 14 - bw;
  const by = y + (rowH - bh)/2;
  const hov = mx>=bx && mx<=bx+bw && my>=by && my<=by+bh;

  if (game.resetState === 1){
    const pulse = 0.55 + 0.45*Math.sin(game.t*7);
    ctx.fillStyle = `rgba(255,107,138,${0.10 + 0.16*pulse})`;
    ctx.strokeStyle = `rgba(255,107,138,${0.6 + 0.4*pulse})`;
    ctx.lineWidth = 1.2;
    roundRect(bx, by, bw, bh, 3);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = `rgba(255,107,138,${0.85 + 0.15*pulse})`;
    ctx.font = '500 10px "IBM Plex Mono",monospace';
    ctx.textAlign = 'center';
    ctx.fillText('CONFIRM ' + Math.ceil(game.resetTimer), bx + bw/2, by + bh/2 + 4);
  } else {
    ctx.fillStyle = hov ? 'rgba(255,107,138,0.10)' : 'rgba(15,20,35,0.6)';
    ctx.strokeStyle = hov ? 'rgba(255,107,138,0.7)' : 'rgba(255,107,138,0.4)';
    ctx.lineWidth = 1;
    roundRect(bx, by, bw, bh, 3);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = hov ? '#ff6b8a' : 'rgba(255,107,138,0.85)';
    ctx.font = '500 10px "IBM Plex Mono",monospace';
    ctx.textAlign = 'center';
    ctx.fillText('RESET', bx + bw/2, by + bh/2 + 4);
  }
  game.buttonHits.push({ x:bx, y:by, w:bw, h:bh, action:tryReset });
  return rowH;
}

// gear icon shown top-right of the menu and shop
function drawGearIcon(){
  const size = 28;
  const x = W - 14 - size;
  const y = 14;
  const cx = x + size/2;
  const cy = y + size/2;
  const hov = mx>=x && mx<=x+size && my>=y && my<=y+size;

  ctx.strokeStyle = hov ? 'rgba(232,235,242,0.85)' : 'rgba(232,235,242,0.45)';
  ctx.fillStyle = hov ? 'rgba(232,235,242,0.06)' : 'rgba(15,20,35,0.4)';
  ctx.lineWidth = 1;
  roundRect(x, y, size, size, 4);
  ctx.fill();
  ctx.stroke();

  // simple gear glyph: 8 teeth
  ctx.strokeStyle = hov ? '#e8ebf2' : 'rgba(232,235,242,0.7)';
  ctx.lineWidth = 1.4;
  const teeth = 8;
  const inner = 5;
  const outer = 8;
  ctx.beginPath();
  for (let i = 0; i < teeth; i++){
    const a1 = (i / teeth) * TAU;
    const a2 = ((i + 0.5) / teeth) * TAU;
    const a3 = ((i + 1) / teeth) * TAU;
    ctx.lineTo(cx + Math.cos(a1) * outer, cy + Math.sin(a1) * outer);
    ctx.lineTo(cx + Math.cos(a2) * inner, cy + Math.sin(a2) * inner);
    ctx.lineTo(cx + Math.cos(a3) * outer, cy + Math.sin(a3) * outer);
  }
  ctx.closePath();
  ctx.stroke();
  // inner circle
  ctx.beginPath();
  ctx.arc(cx, cy, 2.2, 0, TAU);
  ctx.stroke();

  game.buttonHits.push({ x, y, w:size, h:size, action:openSettings });
}

function drawButton(x, y, w, h, label, action, primary){
  const hov = mx>=x && mx<=x+w && my>=y && my<=y+h;
  ctx.lineWidth = hov ? 1.5 : 1;
  if (primary){
    ctx.fillStyle = hov ? 'rgba(94,233,255,0.18)' : 'rgba(94,233,255,0.08)';
    ctx.strokeStyle = '#5ee9ff';
    if (hov){ ctx.shadowColor = '#5ee9ff'; ctx.shadowBlur = 16; }
  } else {
    ctx.fillStyle = hov ? 'rgba(232,235,242,0.06)' : 'rgba(232,235,242,0.02)';
    ctx.strokeStyle = hov ? 'rgba(232,235,242,0.5)' : 'rgba(232,235,242,0.25)';
  }
  roundRect(x, y, w, h, 4);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.stroke();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = primary ? '#fff' : (hov ? '#e8ebf2' : 'rgba(232,235,242,0.7)');
  ctx.font = '500 13px "IBM Plex Mono",monospace';
  ctx.fillText(label, x+w/2, y+h/2+1);
  ctx.textBaseline = 'alphabetic';
  game.buttonHits.push({x,y,w,h,action});
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function drawShop(){
  ctx.fillStyle = 'rgba(6,8,16,0.65)';
  ctx.fillRect(0,0,W,H);

  const narrow = W < 720;

  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(232,235,242,0.5)';
  ctx.font = '300 11px "IBM Plex Mono",monospace';
  ctx.fillText('— THE  ARCHITECT —', CX, narrow ? 32 : 50);
  ctx.fillStyle = '#e8ebf2';
  ctx.font = `300 italic ${narrow ? 28 : 44}px "Fraunces",serif`;
  ctx.fillText('Spend or descend.', CX, narrow ? 60 : 92);

  // currency line — show both
  ctx.fillStyle = '#5ee9ff';
  ctx.font = `300 italic ${narrow ? 14 : 17}px "Fraunces",serif`;
  ctx.fillText(formatScore(meta.totalScore) + ' score · ' + (meta.totalEssence||0) + ' essence', CX, narrow ? 80 : 118);

  // tab bar
  const tabY = narrow ? 96 : 140;
  drawShopTabs(tabY, narrow);

  // gear icon (top-right) — opens settings, which contains reset
  drawGearIcon();

  // grid layout
  const cols = narrow ? 2 : 3;
  const items = shopUI.tab === 'passives' ? PASSIVES : META_UPGRADES;
  const includeAscend = shopUI.tab === 'stats';  // ASCEND card pinned to bottom of stats grid
  const totalItems = items.length + (includeAscend ? 1 : 0);
  const rows = Math.ceil(totalItems / cols);
  const gx = narrow ? 12 : 24;
  const gy = narrow ? 12 : 24;
  const maxCardW = narrow ? 180 : 220;
  const cardW = Math.min(maxCardW, (W - 32 - (cols-1)*gx) / cols);
  const cardH = narrow ? 138 : 164;
  const totalW = cols*cardW + (cols-1)*gx;

  const headerEnd = tabY + 30;
  const backY = H - 70;
  const cardsAreaTop = headerEnd;
  const cardsAreaBottom = backY - 18;
  const cardsAreaH = Math.max(80, cardsAreaBottom - cardsAreaTop);
  const contentH = rows*cardH + (rows-1)*gy + 16;
  shopUI.maxScroll = Math.max(0, contentH - cardsAreaH);
  shopUI.scroll = clamp(shopUI.scroll, 0, shopUI.maxScroll);

  const startX = CX - totalW/2;
  const startY = cardsAreaTop + 8 - shopUI.scroll;

  ctx.save();
  ctx.beginPath();
  ctx.rect(0, cardsAreaTop, W, cardsAreaH);
  ctx.clip();

  if (shopUI.tab === 'passives'){
    for (let i=0;i<PASSIVES.length;i++){
      const p = PASSIVES[i];
      const col = i%cols, row = Math.floor(i/cols);
      const x = startX + col*(cardW+gx);
      const y = startY + row*(cardH+gy);
      drawPassiveCard(x, y, cardW, cardH, p, cardsAreaTop, cardsAreaBottom);
    }
  } else {
    for (let i=0;i<META_UPGRADES.length;i++){
      const u = META_UPGRADES[i];
      const col = i%cols, row = Math.floor(i/cols);
      const x = startX + col*(cardW+gx);
      const y = startY + row*(cardH+gy);
      drawShopCard(x, y, cardW, cardH, u, cardsAreaTop, cardsAreaBottom);
    }
    // ASCEND card — pinned at the bottom of the stats grid
    const ai = META_UPGRADES.length;
    const acol = ai%cols, arow = Math.floor(ai/cols);
    const ax = startX + acol*(cardW+gx);
    const ay = startY + arow*(cardH+gy);
    drawAscendCard(ax, ay, cardW, cardH, cardsAreaTop, cardsAreaBottom);
  }

  ctx.restore();

  // top/bottom fade hint when content overflows
  if (shopUI.maxScroll > 0){
    if (shopUI.scroll > 2){
      const grd = ctx.createLinearGradient(0, cardsAreaTop, 0, cardsAreaTop + 24);
      grd.addColorStop(0, 'rgba(6,8,16,0.85)');
      grd.addColorStop(1, 'rgba(6,8,16,0)');
      ctx.fillStyle = grd;
      ctx.fillRect(0, cardsAreaTop, W, 24);
    }
    if (shopUI.scroll < shopUI.maxScroll - 2){
      const grd = ctx.createLinearGradient(0, cardsAreaBottom - 24, 0, cardsAreaBottom);
      grd.addColorStop(0, 'rgba(6,8,16,0)');
      grd.addColorStop(1, 'rgba(6,8,16,0.85)');
      ctx.fillStyle = grd;
      ctx.fillRect(0, cardsAreaBottom - 24, W, 24);
    }
    const trackH = cardsAreaH - 16;
    const thumbH = Math.max(28, trackH * (cardsAreaH / contentH));
    const thumbY = cardsAreaTop + 8 + (trackH - thumbH) * (shopUI.scroll / shopUI.maxScroll);
    ctx.fillStyle = 'rgba(232,235,242,0.08)';
    ctx.fillRect(W - 7, cardsAreaTop + 8, 2, trackH);
    ctx.fillStyle = 'rgba(94,233,255,0.55)';
    ctx.fillRect(W - 7, thumbY, 2, thumbH);
  }

  const backW = narrow ? Math.min(280, W-48) : 240;
  drawButton(CX - backW/2, backY, backW, 44, 'BACK  TO  MENU', ()=>{ game.scene='menu'; }, false);

  if (game.shopMsgTimer > 0){
    ctx.textAlign = 'center';
    ctx.fillStyle = `rgba(255,107,138,${clamp(game.shopMsgTimer,0,1)})`;
    ctx.font = '300 12px "IBM Plex Mono",monospace';
    ctx.fillText(game.shopMsg, CX, backY - 20);
  }

  if (shopUI.settingsOpen) drawSettings(narrow);
  // ascend confirmation modal: render last so it's on top, and clear all underlying
  // hit registrations so only modal buttons are interactive while it's up.
  if (shopUI.ascendConfirm){
    game.buttonHits = [];
    drawAscendConfirm(narrow);
  }
}

function drawAscendCard(x, y, w, h, areaTop, areaBottom){
  const available = canAscend();
  const tight = w < 200;
  const padX = tight ? 12 : 18;
  const symSize = tight ? 18 : 22;
  const titleSize = tight ? 11 : 13;
  const descSize = tight ? 10 : 11;
  const lh = tight ? 12 : 14;

  const hov = mx>=x && mx<=x+w && my>=y && my<=y+h;
  const pulse = 0.6 + 0.4 * Math.sin(game.t * 1.6);

  // gold-themed visuals to distinguish from cyan stat upgrades
  if (available && hov){
    ctx.fillStyle = `rgba(250,204,21,${0.10 + 0.06*pulse})`;
    ctx.strokeStyle = '#facc15';
    ctx.shadowColor = '#facc15';
    ctx.shadowBlur = 18;
  } else if (available){
    ctx.fillStyle = 'rgba(40,30,8,0.78)';
    ctx.strokeStyle = `rgba(250,204,21,${0.35 + 0.15*pulse})`;
  } else {
    ctx.fillStyle = 'rgba(15,20,35,0.5)';
    ctx.strokeStyle = 'rgba(232,235,242,0.12)';
  }
  ctx.lineWidth = (available && hov) ? 1.5 : 1;
  roundRect(x, y, w, h, 4);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.stroke();

  ctx.textAlign = 'left';
  ctx.fillStyle = available ? '#facc15' : 'rgba(232,235,242,0.3)';
  ctx.font = `300 ${symSize}px "Fraunces",serif`;
  ctx.fillText('▲', x+padX, y + (tight ? 26 : 30));

  ctx.fillStyle = available ? '#fff' : 'rgba(232,235,242,0.4)';
  ctx.font = `500 ${titleSize}px "IBM Plex Mono",monospace`;
  ctx.fillText('ASCEND', x + padX + (tight ? 22 : 26), y + (tight ? 24 : 28));

  ctx.fillStyle = available ? 'rgba(232,235,242,0.7)' : 'rgba(232,235,242,0.3)';
  ctx.font = `300 ${descSize}px "IBM Plex Mono",monospace`;

  const owned = totalStatLevels();
  let descLines;
  if (available){
    const nextRank = (meta.prestige || 0) + 1;
    const nextMult = prestigeCurve(nextRank);
    const curMult = meta.prestigeMult || 1;
    const gainPct = ((nextMult - curMult) * 100).toFixed(1);
    descLines = [
      'Reset stats. Keep passives.',
      'Permanent score multiplier:',
      curMult.toFixed(2) + 'x  →  ' + nextMult.toFixed(2) + 'x  (+' + gainPct + '%)',
    ];
  } else {
    descLines = [
      'First ascension unlocks at',
      '12 stat levels owned.',
      owned + ' / 12 levels owned',
    ];
  }
  for (let i=0;i<descLines.length;i++){
    ctx.fillText(descLines[i], x+padX, y + (tight ? 44 : 52) + i*lh);
  }

  // bottom-right: rank badge if available, progress bar if locked
  ctx.textAlign = 'right';
  if (available){
    ctx.fillStyle = '#facc15';
    ctx.font = `500 ${tight?12:13}px "IBM Plex Mono",monospace`;
    ctx.fillText('▲ P' + ((meta.prestige || 0) + 1), x+w-padX, y+h-(tight?14:17));
  } else {
    const pct = clamp(owned / 12, 0, 1);
    const barW = w - padX*2;
    const barH = 3;
    const barX = x + padX;
    const barY = y + h - (tight ? 14 : 18);
    ctx.fillStyle = 'rgba(232,235,242,0.12)';
    ctx.fillRect(barX, barY, barW, barH);
    ctx.fillStyle = '#facc15';
    ctx.fillRect(barX, barY, barW * pct, barH);
  }

  if (available){
    const top = areaTop !== undefined ? Math.max(y, areaTop) : y;
    const bot = areaBottom !== undefined ? Math.min(y+h, areaBottom) : (y+h);
    const visH = bot - top;
    if (visH >= 28){
      game.buttonHits.push({x, y:top, w, h:visH, action:()=>{
        shopUI.ascendConfirm = true;
      }});
    }
  }
}

function drawAscendConfirm(narrow){
  // dim backdrop — block underlying interaction visually
  ctx.fillStyle = 'rgba(6,8,16,0.88)';
  ctx.fillRect(0, 0, W, H);

  const panelW = narrow ? Math.min(W-32, 380) : 440;
  const panelH = narrow ? 360 : 340;
  const px = CX - panelW/2;
  const py = CY - panelH/2;

  ctx.fillStyle = 'rgba(15,20,35,0.97)';
  ctx.strokeStyle = '#facc15';
  ctx.lineWidth = 1;
  ctx.shadowColor = '#facc15';
  ctx.shadowBlur = 28;
  roundRect(px, py, panelW, panelH, 6);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.stroke();

  // title
  ctx.textAlign = 'center';
  ctx.fillStyle = '#facc15';
  ctx.font = '300 italic 30px "Fraunces",serif';
  ctx.fillText('ASCEND', CX, py + 46);

  // divider
  ctx.strokeStyle = 'rgba(250,204,21,0.3)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(px + 28, py + 64);
  ctx.lineTo(px + panelW - 28, py + 64);
  ctx.stroke();

  const contentX = px + 32;
  let cy = py + 90;
  const lh = 17;
  const sectionGap = 10;

  ctx.textAlign = 'left';

  // RESET section
  ctx.fillStyle = 'rgba(255,107,138,0.9)';
  ctx.font = '500 9px "IBM Plex Mono",monospace';
  ctx.fillText('YOU  WILL  RESET', contentX, cy);
  cy += 15;
  ctx.fillStyle = 'rgba(232,235,242,0.85)';
  ctx.font = '300 11px "IBM Plex Mono",monospace';
  ctx.fillText('·  Stat upgrades  (' + totalStatLevels() + '  levels)', contentX, cy);
  cy += lh;

function drawShopTabs(y, narrow){
  const labels = [
    { id:'stats', text:'STATS', currency:'score' },
    { id:'passives', text:'PASSIVES', currency:'essence' },
  ];
  const tabW = narrow ? 130 : 160;
  const gap = narrow ? 8 : 14;
  const totalW = tabW * labels.length + gap * (labels.length-1);
  const startX = CX - totalW/2;
  for (let i=0;i<labels.length;i++){
    const lab = labels[i];
    const x = startX + i*(tabW + gap);
    const active = shopUI.tab === lab.id;
    ctx.lineWidth = active ? 1.4 : 1;
    ctx.fillStyle = active ? 'rgba(94,233,255,0.10)' : 'rgba(232,235,242,0.02)';
    ctx.strokeStyle = active ? '#5ee9ff' : 'rgba(232,235,242,0.20)';
    roundRect(x, y, tabW, 28, 3);
    ctx.fill();
    ctx.stroke();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = active ? '#5ee9ff' : 'rgba(232,235,242,0.5)';
    ctx.font = '500 11px "IBM Plex Mono",monospace';
    ctx.fillText(lab.text, x + tabW/2, y + 15);
    ctx.textBaseline = 'alphabetic';
    if (!active){
      game.buttonHits.push({ x, y, w:tabW, h:28, action:()=>{

        shopUI.scroll = 0;
      }});

function drawShopCard(x, y, w, h, u, areaTop, areaBottom){
  const lvl = levelOf(u.id);
  const max = u.costs.length;
  const maxed = isMaxed(u);
  const cost = nextCost(u);
  const afford = canAfford(u);
  const hov = mx>=x && mx<=x+w && my>=y && my<=y+h;
  const interactive = !maxed && afford;
  const tight = w < 200;

  if (maxed){
    ctx.fillStyle = 'rgba(94,233,255,0.05)';
    ctx.strokeStyle = 'rgba(94,233,255,0.4)';
  } else if (interactive && hov){
    ctx.fillStyle = 'rgba(94,233,255,0.12)';
    ctx.strokeStyle = '#5ee9ff';
    ctx.shadowColor = '#5ee9ff';
    ctx.shadowBlur = 16;
  } else if (interactive){
    ctx.fillStyle = 'rgba(15,20,35,0.85)';
    ctx.strokeStyle = 'rgba(94,233,255,0.35)';
  } else {
    ctx.fillStyle = 'rgba(15,20,35,0.5)';
    ctx.strokeStyle = 'rgba(232,235,242,0.12)';
  }
  ctx.lineWidth = (interactive && hov) ? 1.5 : 1;
  roundRect(x, y, w, h, 4);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.stroke();

  const padX = tight ? 12 : 18;
  const symSize = tight ? 18 : 22;
  const titleSize = tight ? 11 : 13;
  const descSize = tight ? 10 : 11;
  const lh = tight ? 12 : 14;

  ctx.textAlign = 'left';
  ctx.fillStyle = maxed ? '#5ee9ff' : (interactive ? 'rgba(232,235,242,0.7)' : 'rgba(232,235,242,0.3)');
  ctx.font = `300 ${symSize}px "Fraunces",serif`;
  ctx.fillText(u.symbol, x+padX, y + (tight ? 26 : 30));

  ctx.fillStyle = maxed ? '#fff' : (interactive ? '#e8ebf2' : 'rgba(232,235,242,0.4)');
  ctx.font = `500 ${titleSize}px "IBM Plex Mono",monospace`;
  ctx.fillText(u.title, x + padX + (tight ? 22 : 26), y + (tight ? 24 : 28));

  ctx.fillStyle = interactive || maxed ? 'rgba(232,235,242,0.65)' : 'rgba(232,235,242,0.3)';
  ctx.font = `300 ${descSize}px "IBM Plex Mono",monospace`;
  wrapText(u.desc, x+padX, y + (tight ? 44 : 52), w - padX*2, lh);

  const pipR = tight ? 3 : 4, pipG = tight ? 6 : 8;
  let px = x+padX;
  const py = y + h - (tight ? 18 : 22);
  for (let i=0;i<max;i++){
    const filled = i < lvl;
    ctx.fillStyle = filled ? '#5ee9ff' : 'rgba(232,235,242,0.18)';
    ctx.beginPath();
    ctx.arc(px+pipR, py, pipR, 0, TAU);
    ctx.fill();
    px += pipR*2 + pipG;
  }

  ctx.textAlign = 'right';
  if (maxed){
    ctx.fillStyle = '#5ee9ff';
    ctx.font = `500 ${tight?10:11}px "IBM Plex Mono",monospace`;
    ctx.fillText('MAX', x+w-padX, y+h-(tight?15:18));
  } else {
    ctx.fillStyle = afford ? '#fff' : 'rgba(255,107,138,0.7)';
    ctx.font = `500 ${tight?12:13}px "IBM Plex Mono",monospace`;
    ctx.fillText('⊙ ' + cost, x+w-padX, y+h-(tight?14:17));
  }

  if (!maxed){
    // only register a tap area for the visible portion of the card
    const top = areaTop !== undefined ? Math.max(y, areaTop) : y;
    const bot = areaBottom !== undefined ? Math.min(y+h, areaBottom) : (y+h);
    const visH = bot - top;
    if (visH >= 28){
      game.buttonHits.push({x, y:top, w, h:visH, action:()=>{
        if (afford){
          buyUpgrade(u);
          ringBurst(x+w/2, y+h/2, '#5ee9ff', 16);
        } else {
          game.shopMsg = 'Not enough score · need ' + (cost - meta.totalScore) + ' more';
          game.shopMsgTimer = 2.0;
        }
      }});
    }
  }
}

function drawPassiveCard(x, y, w, h, p, areaTop, areaBottom){
  const lvl = passiveLevel(p.id);
  const max = p.costs.length;
  const owned = lvl > 0;
  const equipped = passiveEquipped(p.id);
  const maxed = isPassiveMaxed(p);
  const cost = nextPassiveCost(p);
  const afford = canAffordPassive(p);
  const hov = mx>=x && mx<=x+w && my>=y && my<=y+h;
  const tight = w < 200;
  const interactive = !maxed && afford;

  if (maxed){
    ctx.fillStyle = 'rgba(94,233,255,0.05)';
    ctx.strokeStyle = 'rgba(94,233,255,0.4)';
  } else if (interactive && hov){
    ctx.fillStyle = 'rgba(94,233,255,0.12)';
    ctx.strokeStyle = '#5ee9ff';
    ctx.shadowColor = '#5ee9ff';
    ctx.shadowBlur = 16;
  } else if (interactive){
    ctx.fillStyle = 'rgba(15,20,35,0.85)';
    ctx.strokeStyle = 'rgba(94,233,255,0.35)';
  } else {
    ctx.fillStyle = 'rgba(15,20,35,0.5)';
    ctx.strokeStyle = 'rgba(232,235,242,0.12)';
  }
  ctx.lineWidth = (interactive && hov) ? 1.5 : 1;
  roundRect(x, y, w, h, 4);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.stroke();

  const padX = tight ? 12 : 18;
  const symSize = tight ? 18 : 22;
  const titleSize = tight ? 11 : 13;
  const descSize = tight ? 10 : 11;
  const lh = tight ? 12 : 14;

  // symbol
  ctx.textAlign = 'left';
  ctx.fillStyle = owned ? '#5ee9ff' : (interactive ? 'rgba(232,235,242,0.7)' : 'rgba(232,235,242,0.3)');
  ctx.font = `300 ${symSize}px "Fraunces",serif`;
  ctx.fillText(p.symbol, x+padX, y + (tight ? 26 : 30));

  // title
  ctx.fillStyle = owned ? '#fff' : (interactive ? '#e8ebf2' : 'rgba(232,235,242,0.4)');
  ctx.font = `500 ${titleSize}px "IBM Plex Mono",monospace`;
  ctx.fillText(p.title, x + padX + (tight ? 22 : 26), y + (tight ? 24 : 28));

  // EQUIPPED tag (top-right of card)
  if (equipped){
    const tagW = tight ? 56 : 66;
    const tagH = 16;
    const tagX = x + w - padX - tagW;
    const tagY = y + (tight ? 14 : 16);
    ctx.fillStyle = 'rgba(94,233,255,0.18)';
    ctx.strokeStyle = 'rgba(94,233,255,0.6)';
    ctx.lineWidth = 1;
    roundRect(tagX, tagY, tagW, tagH, 2);
    ctx.fill();
    ctx.stroke();
    ctx.textAlign = 'center';
    ctx.fillStyle = '#5ee9ff';
    ctx.font = '500 8px "IBM Plex Mono",monospace';
    ctx.textBaseline = 'middle';
    ctx.fillText('EQUIPPED', tagX + tagW/2, tagY + tagH/2 + 0.5);
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
  }

  // short label (italic, one line)
  ctx.fillStyle = (interactive || owned) ? 'rgba(232,235,242,0.55)' : 'rgba(232,235,242,0.3)';
  ctx.font = `300 italic ${tight ? 9 : 10}px "Fraunces",serif`;
  ctx.fillText(p.short, x+padX, y + (tight ? 42 : 50));

  // separator
  ctx.strokeStyle = 'rgba(94,233,255,0.12)';
  ctx.lineWidth = 1;
  const sepY = y + (tight ? 50 : 58);
  ctx.beginPath();
  ctx.moveTo(x+padX, sepY);
  ctx.lineTo(x+w-padX, sepY);
  ctx.stroke();

  // level table
  if (p.levels && p.levels.length > 0){
    const tableSize = tight ? 9 : 10;
    const rowH = tight ? 13 : 15;
    const tableY = sepY + (tight ? 11 : 13);
    const labelColW = tight ? 56 : 66;
    const valueArea = w - padX*2 - labelColW;
    const colW = valueArea / 3;

    for (let r = 0; r < p.levels.length; r++){
      const row = p.levels[r];
      const rowY = tableY + r * rowH;

      // label (left)
      ctx.textAlign = 'left';
      ctx.fillStyle = (interactive || owned) ? 'rgba(232,235,242,0.45)' : 'rgba(232,235,242,0.25)';
      ctx.font = `300 ${tableSize}px "IBM Plex Mono",monospace`;
      ctx.fillText(row.label, x+padX, rowY);

      // values (one per level, center-aligned within their column)
      ctx.textAlign = 'center';
      for (let i = 0; i < row.values.length; i++){
        const colCenterX = x + padX + labelColW + colW * (i + 0.5);
        const isOwnedLevel = (i + 1) <= lvl;
        const isNextLevel = !maxed && (i + 1) === lvl + 1;

        if (isOwnedLevel){
          // achieved levels — bright cyan
          ctx.fillStyle = '#5ee9ff';
          ctx.font = `500 ${tableSize}px "IBM Plex Mono",monospace`;
        } else if (isNextLevel){
          // next available — white bold
          ctx.fillStyle = '#ffffff';
          ctx.font = `500 ${tableSize}px "IBM Plex Mono",monospace`;
        } else {
          // future levels — dim
          ctx.fillStyle = 'rgba(232,235,242,0.25)';
          ctx.font = `300 ${tableSize}px "IBM Plex Mono",monospace`;
        }
        ctx.fillText(row.values[i], colCenterX, rowY);
      }
    }
  }
  ctx.textAlign = 'left';

  // pip indicators
  const pipR = tight ? 3 : 4, pipG = tight ? 6 : 8;
  let px = x+padX;
  const py = y + h - (tight ? 18 : 22);
  for (let i=0;i<max;i++){
    const filled = i < lvl;
    ctx.fillStyle = filled ? '#5ee9ff' : 'rgba(232,235,242,0.18)';
    ctx.beginPath();
    ctx.arc(px+pipR, py, pipR, 0, TAU);
    ctx.fill();
    px += pipR*2 + pipG;
  }

  // cost / max indicator
  ctx.textAlign = 'right';
  if (maxed){
    ctx.fillStyle = '#5ee9ff';
    ctx.font = `500 ${tight?10:11}px "IBM Plex Mono",monospace`;
    ctx.fillText('MAX', x+w-padX, y+h-(tight?15:18));
  } else {
    ctx.fillStyle = afford ? '#fff' : 'rgba(255,107,138,0.7)';
    ctx.font = `500 ${tight?12:13}px "IBM Plex Mono",monospace`;
    ctx.fillText('◊ ' + cost, x+w-padX, y+h-(tight?14:17));
  }

  // hit area: visible portion only
  if (!maxed){
    const top = areaTop !== undefined ? Math.max(y, areaTop) : y;
    const bot = areaBottom !== undefined ? Math.min(y+h, areaBottom) : (y+h);
    const visH = bot - top;
    if (visH >= 28){
      game.buttonHits.push({x, y:top, w, h:visH, action:()=>{
        if (afford){
          buyPassive(p);
          ringBurst(x+w/2, y+h/2, '#5ee9ff', 16);
        } else {
          game.shopMsg = 'Not enough essence · need ' + (cost - (meta.totalEssence||0)) + ' more';
          game.shopMsgTimer = 2.0;
        }
      }});
    }
  }
}

function wrapText(text, x, y, maxW, lh){
  const words = text.split(' ');
  let line = '';
  let yy = y;
  for (let i=0;i<words.length;i++){
    const test = line + words[i] + ' ';
    if (ctx.measureText(test).width > maxW && i > 0){
      ctx.fillText(line.trim(), x, yy);
      line = words[i] + ' ';
      yy += lh;
    } else line = test;
  }
  ctx.fillText(line.trim(), x, yy);
}

function drawModifierPick(){
  ctx.fillStyle = 'rgba(6,8,16,0.7)';
  ctx.fillRect(0, 0, W, H);

  const narrow = W < 720;
  ctx.textAlign = 'center';

  // header
  ctx.fillStyle = 'rgba(232,235,242,0.5)';
  ctx.font = '300 11px "IBM Plex Mono",monospace';
  ctx.fillText('— THE  CHOICE —', CX, narrow ? 36 : 60);
  ctx.fillStyle = '#e8ebf2';
  ctx.font = `300 italic ${narrow ? 30 : 44}px "Fraunces",serif`;
  ctx.fillText('Choose a modifier.', CX, narrow ? 70 : 110);
  ctx.fillStyle = 'rgba(232,235,242,0.45)';
  ctx.font = '300 11px "IBM Plex Mono",monospace';
  ctx.fillText('Each modifier reshapes the run and earns a score multiplier.', CX, narrow ? 92 : 138);

  const picks = game.modifierPicks || [];
  if (picks.length === 0){
    // fallback — should be rare; auto-fill if somehow empty
    rollModifierPicks();
  }

  // card layout
  let cardW, cardH, gap, startX, startY;
  if (narrow){
    cardW = Math.min(W - 40, 320);
    cardH = 86;
    gap = 10;
    startX = CX - cardW/2;
    startY = 116;
  } else {
    cardW = Math.min(220, (W - 80) / 3);
    cardH = 200;
    gap = 22;
    const totalW = cardW*3 + gap*2;
    startX = CX - totalW/2;
    startY = CY - cardH/2;
  }

  for (let i = 0; i < 3; i++){
    const m = picks[i];
    if (!m) continue;
    const x = narrow ? startX : (startX + i*(cardW+gap));
    const y = narrow ? (startY + i*(cardH+gap)) : startY;
    drawModifierCard(x, y, cardW, cardH, m, i, narrow);
  }

  // DEFAULT button — descend without modifier
  const defW = narrow ? Math.min(280, W-48) : 320;
  const defH = 44;
  const defY = narrow ? (startY + 3*(cardH+gap) + 8) : (startY + cardH + 28);
  drawButton(CX - defW/2, defY, defW, defH, 'DESCEND  WITHOUT  MODIFIER', ()=>selectModifier(null), false);

  // back to menu hint
  ctx.fillStyle = 'rgba(232,235,242,0.3)';
  ctx.font = '300 10px "IBM Plex Mono",monospace';
  ctx.fillText(narrow ? 'tap a card to choose' : '1 2 3  pick  ·  SPACE  default  ·  ESC  back', CX, defY + defH + 22);
}

function drawResult(){
  const t = clamp(game.resultTimer / 0.6, 0, 1);
  ctx.fillStyle = `rgba(6,8,16,${0.78*t})`;
  ctx.fillRect(0,0,W,H);

  ctx.globalAlpha = t;
  ctx.textAlign = 'center';

  const r = game.result;
  const narrow = W < 540;

  ctx.fillStyle = `rgba(${r.survived?'94,233,255':'255,107,138'},0.7)`;
  ctx.font = '300 12px "IBM Plex Mono",monospace';
  ctx.fillText(r.survived ? '— YOU  SURVIVED  THE  VOID —' : '— THE  VOID  CLAIMED  YOU —', CX, CY - 180);

  ctx.fillStyle = '#e8ebf2';
  ctx.font = '300 italic 76px "Fraunces",serif';
  ctx.fillText(r.time.toFixed(1) + 's', CX, CY - 115);

  ctx.strokeStyle = 'rgba(232,235,242,0.18)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(CX-100, CY-88); ctx.lineTo(CX+100, CY-88);
  ctx.stroke();

  // score collected
  ctx.fillStyle = r.survived ? '#5ee9ff' : '#ff6b8a';
  ctx.font = '300 italic 30px "Fraunces",serif';
  ctx.fillText('+' + formatScore(r.gained), CX, CY - 52);
  ctx.fillStyle = 'rgba(232,235,242,0.55)';
  ctx.font = '300 10px "IBM Plex Mono",monospace';
  ctx.fillText('SCORE  COLLECTED', CX, CY - 34);
  // multiplier breakdown — show prestige / modifier / mode math when any is active
  const showPrestige = (meta.prestige || 0) > 0 && r.prestigeMult && r.baseGained !== undefined;
  const showModifier = r.modifier && r.modifierMult && r.modifierMult !== 1;
  const showMode = r.modeMult && r.modeMult !== 1;
  if (showPrestige || showModifier || showMode){
    let breakdown = formatScore(r.baseGained);
    if (showModifier) breakdown += '  ×  ' + r.modifier.title.replace(/\s+/g,' ') + '  (' + r.modifierMult.toFixed(2) + 'x)';
    if (showMode) breakdown += '  ×  ' + (r.runDuration||30) + 's  (' + r.modeMult.toFixed(2) + 'x)';
    if (showPrestige) breakdown += '  ×  P' + meta.prestige + '  (' + r.prestigeMult.toFixed(2) + 'x)';
    ctx.fillStyle = 'rgba(250,204,21,0.85)';
    ctx.font = '300 italic 11px "Fraunces",serif';
    ctx.fillText(breakdown, CX, CY - 18);

  const stats = [];
  if (r.essence > 0) stats.push({ label:'ESSENCE', value:'+' + r.essence, color:'#5ee9ff' });
  if (r.nearMisses > 0) stats.push({ label:'CLOSE CALLS', value:String(r.nearMisses), color:'rgba(94,233,255,0.7)' });
  if (stats.length > 0){
    const colW = 130;
    const startX = CX - (stats.length-1)*colW/2;
    for (let i=0;i<stats.length;i++){
      const s = stats[i];
      const x = startX + i*colW;
      ctx.fillStyle = s.color;
      ctx.font = '300 italic 18px "Fraunces",serif';
      ctx.fillText(s.value, x, CY - 6);
      ctx.fillStyle = 'rgba(232,235,242,0.4)';
      ctx.font = '300 9px "IBM Plex Mono",monospace';
      ctx.fillText(s.label, x, CY + 10);
    }
  }

  ctx.fillStyle = 'rgba(232,235,242,0.45)';
  ctx.font = '300 10px "IBM Plex Mono",monospace';
  ctx.fillText(formatScore(meta.totalScore) + ' score · ' + (meta.totalEssence||0) + ' essence banked', CX, CY + 30);

  // orb key (always shown, with breathing room above)
  drawOrbKey(CY + 78, narrow);

  // buttons
  if (narrow){
    const bw = Math.min(280, W-48), bh = 44;
    const by = CY + 188;
    drawButton(CX-bw/2, by, bw, bh, 'DESCEND  AGAIN', beginRun, true);
    drawButton(CX-bw/2, by + bh + 10, bw, bh, 'UPGRADES', openShop, false);
  } else {
    const bw = 180, bh = 44, gap = 16;
    const totalW = bw*2 + gap;
    const baseX = CX - totalW/2;
    const by = CY + 188;
    drawButton(baseX, by, bw, bh, 'DESCEND  AGAIN', beginRun, true);
    drawButton(baseX+bw+gap, by, bw, bh, 'UPGRADES', openShop, false);
  }

  ctx.fillStyle = 'rgba(232,235,242,0.3)';
  ctx.font = '300 10px "IBM Plex Mono",monospace';
  const hintY = narrow ? CY + 296 : CY + 256;
  ctx.fillText(narrow ? 'tap to continue' : 'SPACE  retry  ·  U  upgrades  ·  M  menu', CX, hintY);

  ctx.globalAlpha = 1;
}

const ORB_KEY = [
  { type:'cyan',  desc:'+1  essence' },
  { type:'white', desc:'+1  health  ·  +3  essence  if  full' },
  { type:'gold',  desc:'+5  essence  ·  3s  invulnerable  ·  ×3  score' },
];

function drawOrbKey(baseY, narrow){
  const rowH = narrow ? 22 : 24;
  const descFontSize = narrow ? 10 : 11;

  // measure the longest description so the whole block can be centered as a unit
  ctx.font = `300 ${descFontSize}px "IBM Plex Mono",monospace`;
  let maxDescW = 0;
  for (const e of ORB_KEY){
    const w = ctx.measureText(e.desc).width;
    if (w > maxDescW) maxDescW = w;
  }
  const orbDiam = 16;
  const gap = 12;
  const blockW = orbDiam + gap + maxDescW;
  const blockX = CX - blockW/2;
  const orbX = blockX + orbDiam/2;
  const textX = blockX + orbDiam + gap;

  for (let i=0;i<ORB_KEY.length;i++){
    const entry = ORB_KEY[i];
    const def = ORB[entry.type];
    if (!def) continue;
    const y = baseY + i*rowH;

    // mini orb (glow ring + symbol + colored core)
    ctx.shadowColor = def.color;
    ctx.shadowBlur = 6;
    ctx.strokeStyle = def.color;
    ctx.lineWidth = 1.3;
    ctx.beginPath();
    ctx.arc(orbX, y, 7, 0, TAU);
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = def.color;
    ctx.beginPath();
    ctx.arc(orbX, y, 2, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.font = '300 9px "Fraunces",serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(def.symbol, orbX, y + 0.5);
    ctx.textBaseline = 'alphabetic';

    // description, left-aligned with all other descriptions
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(232,235,242,0.65)';
    ctx.font = `300 ${descFontSize}px "IBM Plex Mono",monospace`;
    ctx.fillText(entry.desc, textX, y + 4);
  }
  ctx.textAlign = 'center';
}

function drawFlash(){
  if (game.flash > 0){
    ctx.fillStyle = game.flashColor;
    ctx.globalAlpha = game.flash * 0.32;
    ctx.fillRect(0,0,W,H);
    ctx.globalAlpha = 1;
  }
  // Edge passive: cyan vignette while enemies are slowed
  if (game.passive && game.passive.edge && game.passive.edge.slowTimer > 0){
    const t = game.passive.edge.slowTimer;
    // pick the right max based on level so the alpha curve is correct
    const lvl = activePassiveLevel('edge') || 1;
    const max = EDGE_DURATION[lvl-1];
    const intensity = clamp(t / max, 0, 1);
    const grad = ctx.createRadialGradient(CX, CY, Math.min(W,H)*0.3, CX, CY, Math.max(W,H)*0.7);
    grad.addColorStop(0, `rgba(94,233,255,0)`);
    grad.addColorStop(0.55, `rgba(94,233,255,${0.05 * intensity})`);
    grad.addColorStop(1, `rgba(94,233,255,${0.32 * intensity})`);
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,W,H);
    // top/bottom edge bars for unmistakable "time bent" feel
    ctx.fillStyle = `rgba(94,233,255,${0.6 * intensity})`;
    ctx.fillRect(0, 0, W, 2);
    ctx.fillRect(0, H-2, W, 2);
  }
}

function formatScore(n){
  return n.toLocaleString('en-US');
}

let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now-last)/1000);
  last = now;
  update(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
