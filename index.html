<script>
"use strict";

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let DPR = Math.min(window.devicePixelRatio||1, 2);
let W=0, H=0, CX=0, CY=0;

function resize(){
  W = window.innerWidth; H = window.innerHeight;
  CX = W/2; CY = H/2;
  canvas.width = W*DPR; canvas.height = H*DPR;
  canvas.style.width = W+'px'; canvas.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
resize();
addEventListener('resize', resize);

// ===== util =====
const TAU = Math.PI*2;
const rand = (a,b)=>a+Math.random()*(b-a);
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const lerp = (a,b,t)=>a+(b-a)*t;
const dist = (x1,y1,x2,y2)=>Math.hypot(x2-x1,y2-y1);

// ===== starfield =====
const stars = [];
for(let i=0;i<260;i++){
  stars.push({x:Math.random(), y:Math.random(), r:rand(.3,1.6), tw:rand(0,TAU), sp:rand(.4,2.2), p:rand(.2,1)});
}

// ===== meta (persistent) =====
const META_DEFAULT = { totalScore:0, totalEssence:0, owned:{}, runs:0, bestTime:0, seenOrbs:{}, passives:{}, equipped:[], prestige:0, prestigeMult:1.0, seenAscensionBanner:false, preferredMode:30 };
let meta = {...META_DEFAULT, owned:{}};
function loadMeta(){
  try{
    const s = localStorage.getItem('bound_meta_v2');
    if (s){
      const d = JSON.parse(s);
      meta = {
        ...META_DEFAULT,
        ...d,
        owned: d.owned || {},
        seenOrbs: d.seenOrbs || {},
        passives: d.passives || {},
        equipped: d.equipped || [],
      };
    }
  }catch{}
}
function saveMeta(){
  try{ localStorage.setItem('bound_meta_v2', JSON.stringify(meta)); }catch{}
}
loadMeta();

// ===== meta upgrades =====
const META_UPGRADES = [
  { id:'vitality',  title:'VITALITY',   desc:'Maximum integrity +1',
    costs:[150, 340, 620], symbol:'+',

// Levels stored in meta.passives[id] (0 = not owned, 1-3 = level).

    ],

  },

    id:'greed', title:'GREED', symbol:'¤',

    short:'score-driven essence',
    levels:[
      { label:'every', values:['100 sc', '75 sc', '50 sc'] },
    ],

  },

const PASSIVE_BY_ID = Object.fromEntries(PASSIVES.map(p => [p.id, p]));

function passiveLevel(id){ return (meta.passives && meta.passives[id]) || 0; }
function passiveOwned(id){ return passiveLevel(id) > 0; }
function passiveEquipped(id){ return (meta.equipped || []).includes(id); }
function activePassiveLevel(id){
  if (game.modifierNoPassives) return 0;
  return passiveEquipped(id) ? passiveLevel(id) : 0;
}
function nextPassiveCost(p){ return p.costs[passiveLevel(p.id)] ?? null; }
function isPassiveMaxed(p){ return passiveLevel(p.id) >= p.costs.length; }
function canAffordPassive(p){
  const c = nextPassiveCost(p);
  return c !== null && (meta.totalEssence || 0) >= c;
}

function buyPassive(p){
  if (isPassiveMaxed(p) || !canAffordPassive(p)) return false;
  meta.totalEssence -= nextPassiveCost(p);
  meta.passives = meta.passives || {};
  meta.passives[p.id] = passiveLevel(p.id) + 1;
  // auto-equip on first purchase if a slot is open
  meta.equipped = meta.equipped || [];
  if (passiveLevel(p.id) === 1 && meta.equipped.length < MAX_SLOTS && !meta.equipped.includes(p.id)){
    meta.equipped.push(p.id);
  }
  saveMeta();
  return true;
}

function toggleEquip(id){
  meta.equipped = meta.equipped || [];
  const idx = meta.equipped.indexOf(id);
  if (idx >= 0){
    meta.equipped.splice(idx, 1);
  } else if (meta.equipped.length < MAX_SLOTS){
    meta.equipped.push(id);
  }
  saveMeta();
}

function equipInSlot(slot, id){
  meta.equipped = meta.equipped || [];
  // remove id from any other slot first
  const existing = meta.equipped.indexOf(id);
  if (existing >= 0) meta.equipped.splice(existing, 1);
  // place at slot (extending if needed)
  meta.equipped[slot] = id;
  // compact array: drop holes
  meta.equipped = meta.equipped.filter(x => x);
  saveMeta();
}

function unequipSlot(slot){
  meta.equipped = meta.equipped || [];
  meta.equipped.splice(slot, 1);
  saveMeta();
}


function levelOf(id){ return meta.owned[id] || 0; }
function nextCost(u){ return u.costs[levelOf(u.id)] ?? null; }
function isMaxed(u){ return levelOf(u.id) >= u.costs.length; }
function canAfford(u){ const c = nextCost(u); return c!==null && meta.totalScore >= c; }

function buyUpgrade(u){
  if (isMaxed(u) || !canAfford(u)) return false;
  meta.totalScore -= nextCost(u);
  meta.owned[u.id] = levelOf(u.id) + 1;
  saveMeta();
  return true;
}

function applyMetaUpgrades(player, arena, opts){
  for (const u of META_UPGRADES){
    const lvl = levelOf(u.id);
    for (let i=0;i<lvl;i++) u.apply(player, arena, opts);
  }
  player.hp = player.maxHp;
  player.displayHp = 1;
}

function tryReset(){
  if (game.resetState === 1){
    // confirmed — wipe progression
    meta = { ...META_DEFAULT, owned:{}, passives:{}, equipped:[], seenOrbs:{} };
    saveMeta();
    game.resetState = 0;
    game.resetTimer = 0;
    game.shopMsg = 'Progression wiped · clean slate.';
    game.shopMsgTimer = 2.5;
    ringBurst(CX, CY, '#ff6b8a', 22);
    shopUI.scroll = 0;
  } else {
    game.resetState = 1;
    game.resetTimer = 3;
  }
}

// ===== prestige =====
// Score multiplier curve: soft cap at 2.10x, big early gains, asymptote prevents
// infinite grinding from feeling mandatory. Steep slope through prestige 6 keeps
// the unlock-tier ladder (3/6/9/12/15) interesting.
function prestigeCurve(p){
  return 1 + 0.10 * (1 - Math.pow(0.92, p));
}

function totalStatLevels(){
  let total = 0;
  for (const id in (meta.owned || {})) total += meta.owned[id] || 0;
  return total;
}

// First ascension requires 12 stat levels owned (~44% upgrade saturation).
// After that, always available — no need to re-earn the right to ascend.
function canAscend(){
  if (game.scene === 'playing') return false;
  if ((meta.prestige || 0) === 0) return totalStatLevels() >= 12;
  return true;
}

function ascend(){
  if (!canAscend()) return false;
  meta.prestige = (meta.prestige || 0) + 1;
  meta.prestigeMult = prestigeCurve(meta.prestige);
  meta.owned = {};            // wipe stat upgrades
  meta.totalScore = 0;        // wipe banked score
  meta.seenAscensionBanner = true;  // dismiss banner if it was up
  saveMeta();
  // celebratory feedback — a moment of "you did something significant"
  game.ascendAnim = 1.5;
  ringBurst(CX, CY, '#facc15', 36);
  burst(CX, CY, '#facc15', 24, 3);
  burst(CX, CY, '#ffffff', 16, 2.2);
  game.flash = 0.5;
  game.flashColor = '#facc15';
  // close any modals
  shopUI.ascendConfirm = false;
  shopUI.scroll = 0;
  return true;
}

// arena radius (single source of truth — both initial state and startRun() reference this)
const BASE_ARENA_RADIUS = 96;

// ===== modifiers (per-run challenge modifiers, unlocked at prestige 9) =====
// Each modifier: id, title, desc, category, scoreMult, apply(game) hook applied at startRun.
// Some modifiers also set runtime flags read at integration points (spawnEnemy, updateOrbs,
// damagePlayer, activePassiveLevel). Score multiplier stacks multiplicatively with prestigeMult.
const MODIFIERS = [
  { id:'drifter_storm', title:'DRIFTER  STORM', desc:'Only drifters spawn. +50% spawn rate.',
    category:'CONTENT', scoreMult:1.3,
    apply(g){ g.modifierEnemyFilter = ['drifter']; g.modifierSpawnMult = 1.5; } },
  { id:'hunters', title:'HUNTERS', desc:'Only trackers and snipers spawn.',
    category:'CONTENT', scoreMult:1.4,
    apply(g){ g.modifierEnemyFilter = ['tracker','sniper']; } },
  { id:'big_pieces', title:'BIG  PIECES', desc:'Only brutes. Slow but huge.',
    category:'CONTENT', scoreMult:1.5,
    apply(g){ g.modifierEnemyFilter = ['brute']; } },
  { id:'shatter', title:'SHATTER', desc:'Only splitters. Density cap raised to 16.',
    category:'CONTENT', scoreMult:1.6,
    apply(g){ g.modifierEnemyFilter = ['splitter']; g.modifierMaxDensity = 16; } },

  { id:'tight_quarters', title:'TIGHT  QUARTERS', desc:'Arena radius −25%. Less room to move.',
    category:'SPATIAL', scoreMult:1.5,
    // multiplicative on current radius so Voidspace investment still counts
    apply(g){ g.arena.radius = Math.floor(g.arena.radius * 0.75); } },
  { id:'vast_expanse', title:'VAST  EXPANSE', desc:'Arena radius +35%. Spawn rate +30%.',
    category:'SPATIAL', scoreMult:1.0,
    apply(g){ g.arena.radius = Math.floor(g.arena.radius * 1.35); g.modifierSpawnMult = 1.3; } },

  { id:'flood', title:'FLOOD', desc:'Enemies +30% speed. Density cap reduced to 9.',
    category:'TEMPO', scoreMult:1.5,
    apply(g){ g.modifierEnemySpeedMult = 1.30; g.modifierMaxDensity = 9; } },

  { id:'famine', title:'FAMINE', desc:'Orbs only spawn in the last 10s of each wave.',
    category:'ECONOMY', scoreMult:1.6,
    apply(g){ g.modifierOrbBlock = true; } },

  { id:'glass', title:'GLASS', desc:'One health. First hit ends the run.',

    apply(g){ g.modifierGlass = true; g.player.maxHp = 1; g.player.hp = 1; g.player.displayHp = 1; } },
  { id:'no_passives', title:'NO  PASSIVES', desc:'Passive abilities disabled this run.',
    category:'CHALLENGE', scoreMult:1.8,
    apply(g){ g.modifierNoPassives = true; } },

  // CONTENT additions for the new enemy types — only spawn when picked.
  { id:'zones', title:'ZONES', desc:'Damage fields drop across the arena. Density capped at 4.',
    category:'CONTENT', scoreMult:1.5,
    apply(g){ g.modifierEnemyFilter = ['field']; g.modifierMaxDensity = 4; } },
  { id:'phalanx', title:'PHALANX', desc:'Only shielded foes. Flank for double near-miss score.',
    category:'CONTENT', scoreMult:1.5,
    apply(g){ g.modifierEnemyFilter = ['shielded']; g.modifierMaxDensity = 7; } },
];

function rollModifierPicks(){
  // pick three modifiers from three distinct categories so options always feel varied
  const cats = ['CONTENT','SPATIAL','TEMPO','ECONOMY','CHALLENGE'];
  // shuffle category order (Fisher-Yates)
  for (let i=cats.length-1; i>0; i--){
    const j = Math.floor(Math.random() * (i+1));
    [cats[i], cats[j]] = [cats[j], cats[i]];
  }
  const picks = [];
  for (const cat of cats){
    const pool = MODIFIERS.filter(m => m.category === cat);
    if (pool.length === 0) continue;
    picks.push(pool[Math.floor(Math.random() * pool.length)]);
    if (picks.length >= 3) break;
  }
  game.modifierPicks = picks;
}

function beginRun(){
  // gated entry point used by all "start a run" buttons. Routes to picker if modifiers unlocked.
  if ((meta.prestige || 0) >= 9){
    rollModifierPicks();
    game.activeModifier = null;  // cleared until pick or default
    game.scene = 'modifierPick';
  } else {
    game.activeModifier = null;
    startRun();
  }
}

function selectModifier(m){
  game.activeModifier = m;
  startRun();
}

const COMBO_TIERS = [

// ===== input =====
const keys = {};

const STICK_MAX = 60;

const shopUI = { scroll:0, maxScroll:0, dragging:false, dragStartY:0, dragStartScroll:0, dragMoved:false, pointerId:null, candidate:null, tab:'stats', pickerOpen:false, pickerSlot:-1, pickerScroll:0, pickerMaxScroll:0, settingsOpen:false, ascendConfirm:false };

function openShop(){ shopUI.scroll = 0; game.scene = 'shop'; }

// Cycle through unlocked modes (30 → 60 → 90 → 30). Locked modes are skipped.
// Selected mode persists in meta.preferredMode and is read by startRun().
function cycleMode(){
  const unlocked = [30];
  if ((meta.prestige || 0) >= 6) unlocked.push(60);
  if ((meta.prestige || 0) >= 12) unlocked.push(90);
  const cur = meta.preferredMode || 30;
  const idx = unlocked.indexOf(cur);
  meta.preferredMode = unlocked[(idx + 1) % unlocked.length];
  saveMeta();
}

function modeLabel(dur){
  if (dur === 60) return '60s  ·  EXTENDED';
  if (dur === 90) return '90s  ·  ENDURANCE';
  return '30s  ·  CORE';
}

// ===== pause =====
function pauseGame(){
  if (game.scene !== 'playing') return;
  if (game.paused) return;
  game.paused = true;
  // clear active touch so player doesn't fly when resuming
  touch.active = false;
}
function resumeGame(){
  if (!game.paused) return;
  game.paused = false;
  // also clear stale input on resume
  touch.active = false;
}
function togglePause(){
  if (game.paused) resumeGame();
  else pauseGame();
}

// auto-pause on visibility loss (call, text, app switch, screen lock)
if (typeof document !== 'undefined' && document.addEventListener){
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) pauseGame();
  });
  // also pause on window blur for desktop (alt-tab)
  addEventListener('blur', () => { pauseGame(); });
}

// ===== settings overlay =====
function openSettings(){ shopUI.settingsOpen = true; }
function closeSettings(){
  shopUI.settingsOpen = false;
  // cancel any pending reset confirmation when closing
  game.resetState = 0;
  game.resetTimer = 0;
}

addEventListener('keydown', e=>{
  const k = e.key.toLowerCase();
  if (keys[k]) return;
  keys[k] = true;
  // settings overlay can be open in any non-playing scene; handle escape first
  if (shopUI.settingsOpen && (game.scene === 'menu' || game.scene === 'shop')){
    if (k==='escape') closeSettings();
    return;
  }
  if (game.scene==='menu'){
    if (shopUI.pickerOpen){
      if (k==='escape') closeSlotPicker();
      return;
    }
    if (k===' '||k==='enter'){ e.preventDefault(); beginRun(); }
    else if (k==='u'||k==='b'){ openShop(); }
  } else if (game.scene==='result'){
    if (k===' '||k==='enter'){ e.preventDefault(); beginRun(); }
    else if (k==='u'||k==='b'){ openShop(); }
    else if (k==='m'||k==='escape'){ game.scene = 'menu'; }
  } else if (game.scene==='modifierPick'){
    if (k==='escape'||k==='b'){ game.scene = 'menu'; game.modifierPicks = null; }
    else if (k===' '||k==='enter'){ e.preventDefault(); selectModifier(null); }
    else if (k==='1'||k==='2'||k==='3'){
      const idx = parseInt(k, 10) - 1;
      if (game.modifierPicks && game.modifierPicks[idx]) selectModifier(game.modifierPicks[idx]);
    }
  } else if (game.scene==='shop'){
    // ascend modal absorbs Esc so it doesn't fall through to leaving the shop
    if (shopUI.ascendConfirm){
      if (k==='escape') shopUI.ascendConfirm = false;
      return;
    }
    if (k==='escape'||k==='b'){ game.scene = 'menu'; }
  } else if (game.scene==='playing'){
    if (k==='p' || k==='escape'){ togglePause(); }
  }
});
addEventListener('keyup', e=>{ keys[e.key.toLowerCase()] = false; });

function hitButton(x, y){
  for (const b of game.buttonHits){
    if (x>=b.x && x<=b.x+b.w && y>=b.y && y<=b.y+b.h) return b;
  }
  return null;
}

addEventListener('pointermove', e=>{
  mx = e.clientX; my = e.clientY;
  if (touch.active && e.pointerId === touch.id){
    touch.x = e.clientX;
    touch.y = e.clientY;
  }
  if (game.scene === 'shop' && shopUI.dragging && e.pointerId === shopUI.pointerId){
    const dy = e.clientY - shopUI.dragStartY;
    if (Math.abs(dy) > 6) shopUI.dragMoved = true;
    shopUI.scroll = clamp(shopUI.dragStartScroll - dy, 0, shopUI.maxScroll);
  }
  if (shopUI.pickerOpen && shopUI.dragging && e.pointerId === shopUI.pointerId){
    const dy = e.clientY - shopUI.dragStartY;
    if (Math.abs(dy) > 6) shopUI.dragMoved = true;
    shopUI.pickerScroll = clamp(shopUI.dragStartScroll - dy, 0, shopUI.pickerMaxScroll);
  }
});
addEventListener('pointerdown', e=>{
  mx = e.clientX; my = e.clientY;
  if (game.scene === 'playing'){
    // mouse falls through so PC drag works as a virtual joystick (analog testing path)
    e.preventDefault();
    // when paused, the screen is the resume hit area — let the standard hit detection handle it
    if (game.paused){
      const b = hitButton(e.clientX, e.clientY);
      if (b) b.action();
      return;
    }
    // tap on the pause button takes priority over starting a joystick drag
    const b = hitButton(e.clientX, e.clientY);
    if (b){ b.action(); return; }
    if (!touch.active){
      touch.active = true;
      touch.id = e.pointerId;
      touch.bx = e.clientX;
      touch.by = e.clientY;
      touch.x = e.clientX;
      touch.y = e.clientY;
      // capture the pointer so pointermove keeps firing if the cursor leaves the
      // viewport during a drag. without this the joystick visually freezes at its
      // last in-window position and pops back when the cursor returns.
      try { canvas.setPointerCapture(e.pointerId); } catch {}
    }
    // additional touches ignored — passives handle all "abilities" automatically
  } else if (shopUI.pickerOpen){
    // picker drag-or-tap (works regardless of scene)
    shopUI.dragging = true;
    shopUI.dragStartY = e.clientY;
    shopUI.dragStartScroll = shopUI.pickerScroll;
    shopUI.dragMoved = false;
    shopUI.pointerId = e.pointerId;
    shopUI.candidate = hitButton(e.clientX, e.clientY);
  } else if (game.scene === 'shop'){
    // capture for drag-or-tap; only fire on release if no drag
    shopUI.dragging = true;
    shopUI.dragStartY = e.clientY;
    shopUI.dragStartScroll = shopUI.scroll;
    shopUI.dragMoved = false;
    shopUI.pointerId = e.pointerId;
    shopUI.candidate = hitButton(e.clientX, e.clientY);
  } else {
    const b = hitButton(e.clientX, e.clientY);
    if (b) b.action();
  }
});
function releaseTouch(e){
  if (touch.active && e.pointerId === touch.id){
    touch.active = false;
    try { canvas.releasePointerCapture(e.pointerId); } catch {}
  }
  if (shopUI.dragging && e.pointerId === shopUI.pointerId){
    if (!shopUI.dragMoved && shopUI.candidate) shopUI.candidate.action();
    shopUI.dragging = false;
    shopUI.candidate = null;
  }
}
addEventListener('pointerup', releaseTouch);
addEventListener('pointercancel', releaseTouch);
addEventListener('contextmenu', e=>e.preventDefault());
addEventListener('wheel', e=>{
  if (shopUI.pickerOpen && shopUI.pickerMaxScroll > 0){
    e.preventDefault();
    shopUI.pickerScroll = clamp(shopUI.pickerScroll + e.deltaY, 0, shopUI.pickerMaxScroll);
  } else if (game.scene === 'shop' && shopUI.maxScroll > 0){
    e.preventDefault();
    shopUI.scroll = clamp(shopUI.scroll + e.deltaY, 0, shopUI.maxScroll);
  }
}, { passive:false });

// ===== enemy types =====
const ENEMY = {
  drifter:{
    radius:13, speed:118, color:'#ff6b8a', minTime:30, weight:10,
    behavior(e, dt, p){ e.x+=e.vx*dt; e.y+=e.vy*dt; }
  },
  tracker:{
    radius:11, speed:108, color:'#ff9a3f', minTime:24, weight:5,
    behavior(e, dt, p){
      if (e.age < 1.5){
        const ang = Math.atan2(p.y-e.y, p.x-e.x);
        const cur = Math.atan2(e.vy, e.vx);
        let diff = ((ang - cur + Math.PI*3) % TAU) - Math.PI;
        const turn = clamp(diff, -1.0*dt, 1.0*dt);
        const na = cur + turn;
        const sp = Math.hypot(e.vx, e.vy);
        e.vx = Math.cos(na)*sp; e.vy = Math.sin(na)*sp;
      }
      e.x+=e.vx*dt; e.y+=e.vy*dt;
    }
  },
  bouncer:{
    radius:12, speed:138, color:'#ec4899', minTime:18, weight:4,
    behavior(e, dt, p){
      e.x+=e.vx*dt; e.y+=e.vy*dt;
      const dx = e.x-CX, dy = e.y-CY;
      const d = Math.hypot(dx,dy);
      const R = game.arena.radius - 2;
      if (d > R && e.bouncesLeft > 0){
        const nx = dx/d, ny = dy/d;
        const dot = e.vx*nx + e.vy*ny;
        if (dot > 0){
          e.vx -= 2*dot*nx; e.vy -= 2*dot*ny;
          e.bouncesLeft--;
          burst(e.x, e.y, e.color, 8, 2);
        }
      }
    }
  },
  brute:{
    radius:26, speed:74, color:'#c084fc', minTime:12, weight:2,
    behavior(e, dt, p){ e.x+=e.vx*dt; e.y+=e.vy*dt; }
  },
  splitter:{
    radius:15, speed:110, color:'#dc2626', minTime:8, weight:3,
    behavior(e, dt, p){
      e.x+=e.vx*dt; e.y+=e.vy*dt;
      if (!e.hasSplit && e.age > 0.9){
        e.hasSplit = true;
        const ang = Math.atan2(e.vy, e.vx);
        const sp = Math.hypot(e.vx, e.vy) * 1.15;
        // density-clamped: +1 because the splitter itself is dying this frame, freeing its slot.
        // at cap → 1 child takes splitter's slot; under cap → normal 2 children.
        const splitCap = game.modifierMaxDensity || MAX_DENSITY;
        const room = splitCap - game.enemies.length + 1;
        const numChildren = Math.max(0, Math.min(2, room));
        const offsets = numChildren === 2 ? [-0.55, 0.55] : (numChildren === 1 ? [0] : []);
        for (const off of offsets){
          const a = ang + off;
          game.enemies.push({
            type:'splitter_child', x:e.x, y:e.y,
            vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
            radius:9, color:'#fb7185',
            behavior:ENEMY.drifter.behavior,
            bouncesLeft:0, age:0, active:true, warning:0, warningMax:0, born:true,
          });
        }
        burst(e.x, e.y, e.color, 16, 2.5);
        e.dead = true;
      }
    }
  },
  sniper:{
    radius:9, speed:520, color:'#ef4444', minTime:4, weight:3,
    warningOverride: 1.4,
    behavior(e, dt, p){ e.x+=e.vx*dt; e.y+=e.vy*dt; }
  },
  // FIELD — stationary damage zone. Telegraphs for 1.5s, then deals damage for 4-5.5s, then fades.
  // Spawned inside the arena (custom path in spawnEnemy below). Used by ZONES modifier and longer modes.
  field:{
    radius:30, speed:0, color:'#fb923c', minTime:30, weight:4,
    warningOverride: 1.5,
    behavior(e, dt, p){
      e.zonePhase = e.zonePhase || 'active';
      e.phaseTime = (e.phaseTime || 0) + dt;
      if (!e.zoneDuration) e.zoneDuration = rand(4.0, 5.5);
      if (e.zonePhase === 'active' && e.phaseTime >= e.zoneDuration){
        e.zonePhase = 'fading';
        e.phaseTime = 0;
        e.zoneVisualRadius = e.radius;  // remember for rendering
        e.radius = 0;                    // disable collision while fading
      } else if (e.zonePhase === 'fading' && e.phaseTime >= 0.5){
        e.dead = true;
      }
    }
  },
  // SHIELDED — drifts toward player, has a front-facing shield. Front near-miss blocked,
  // back near-miss earns 2x score. Used by AEGIS modifier and longer modes.
  shielded:{
    radius:12, speed:95, color:'#facc15', minTime:30, weight:4,
    behavior(e, dt, p){
      e.x += e.vx*dt; e.y += e.vy*dt;
      // gentle homing — turn toward player at limited rate so flanking remains possible
      const targetAng = Math.atan2(p.y - e.y, p.x - e.x);
      const curAng = Math.atan2(e.vy, e.vx);
      const speed = Math.hypot(e.vx, e.vy);
      let diff = targetAng - curAng;
      while (diff > Math.PI) diff -= TAU;
      while (diff < -Math.PI) diff += TAU;
      const turnRate = 0.6;  // rad/sec — slow enough that flanking works
      const newAng = curAng + clamp(diff, -turnRate*dt, turnRate*dt);
      e.vx = Math.cos(newAng) * speed;
      e.vy = Math.sin(newAng) * speed;
    }
  },
};

function unlockedTypes(){
  // modifier filter overrides everything (including wave) — BIG PIECES forces brutes
  // from second 0, even though brute.minTime would normally lock it until late game.
  if (game.modifierEnemyFilter && game.modifierEnemyFilter.length > 0){
    return game.modifierEnemyFilter.filter(k => ENEMY[k]);
  }
  // wave-aware progression: each wave is a fresh 30s difficulty ramp. Field/shielded
  // join the pool only at wave 2/3 of longer modes (and never via this path in 30s mode).
  const wTLeft = game.waveTimeLeft || game.timeLeft;
  const wave = game.wave || 1;
  const list = Object.keys(ENEMY).filter(k => {
    if (k === 'field' || k === 'shielded') return false;  // wave bonuses, added below
    return ENEMY[k].minTime >= wTLeft || k === 'drifter';
  });
  if (wave >= 2) list.push('field');
  if (wave >= 3) list.push('shielded');
  return list;
}
function pickEnemyType(){
  const list = unlockedTypes();
  let total = 0;
  for (const k of list) total += ENEMY[k].weight;
  let r = Math.random()*total;
  for (const k of list){ r -= ENEMY[k].weight; if (r<=0) return k; }
  return 'drifter';
}

function spawnEnemy(forceType){
  const type = forceType || pickEnemyType();
  const def = ENEMY[type];

  // FIELD enemies spawn INSIDE the arena (they're stationary damage zones).
  // Skip the edge-spawn-then-aim-inward trajectory used by all other enemies.
  if (type === 'field'){
    const fAng = Math.random() * TAU;
    const fDist = rand(0.30, 0.65) * game.arena.radius;
    game.enemies.push({
      type, x: CX + Math.cos(fAng)*fDist, y: CY + Math.sin(fAng)*fDist,
      vx: 0, vy: 0,
      radius: def.radius, color: def.color,
      behavior: def.behavior,
      bouncesLeft: 0, age: 0, active: false,
      warning: def.warningOverride, warningMax: def.warningOverride,
      born: false,
    });
    return;
  }

  const ang = Math.random()*TAU;
  const spawnDist = game.arena.radius + 70;
  const sx = CX + Math.cos(ang)*spawnDist;
  const sy = CY + Math.sin(ang)*spawnDist;
  let targetAng, targetDist;
  if (type === 'sniper'){
    targetAng = ang + Math.PI + rand(-0.2, 0.2);
    targetDist = rand(0, game.arena.radius * 0.4);
  } else {
    targetAng = ang + Math.PI + rand(-0.55, 0.55);
    targetDist = rand(0, game.arena.radius * 0.55);
  }
  const tx = CX + Math.cos(targetAng)*targetDist;
  const ty = CY + Math.sin(targetAng)*targetDist;
  const ddx = tx-sx, ddy = ty-sy, dd = Math.hypot(ddx,ddy);
  const tProg = 1 - game.timeLeft/game.runDuration;
  const speed = def.speed * (1 + tProg*0.15) * (game.modifierEnemySpeedMult || 1);
  const e = {
    type, x:sx, y:sy,
    vx: ddx/dd*speed, vy: ddy/dd*speed,
    radius: def.radius, color: def.color,
    behavior: def.behavior,
    bouncesLeft: type==='bouncer' ? 3 : 0,
    age:0, active:false,
    warning: def.warningOverride || 0.55,
    warningMax: def.warningOverride || 0.55,
    born:false,
  };
  game.enemies.push(e);
  return e;
}

// ===== particles =====
function burst(x, y, color, n=12, sp=3){
  for (let i=0;i<n;i++){
    const a = Math.random()*TAU;
    const v = rand(sp*30, sp*120);
    game.particles.push({ x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v, life:rand(.3,.7), age:0, r:rand(1,3), color });
  }
}
function ringBurst(x, y, color, n=24){
  for (let i=0;i<n;i++){
    const a = (i/n)*TAU;
    const v = rand(180, 280);
    game.particles.push({ x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v, life:.55, age:0, r:rand(1,2.5), color });
  }
}

function awardNearMiss(e, mult){
  // base 5 score, scaled by combo + meta multiplier. mult > 1 for special cases (e.g. shielded back-pass).
  mult = mult || 1;
  const bonus = 5 * mult * game.combo.mult * game.scoreMult;
  game.scoreFloat += bonus;
  game.nearMissCount++;
  // every near-miss gets a small cyan flick — close calls are the skill currency,
  // they should be felt without reading the score corner
  burst(e.x, e.y, '#5ee9ff', 4, 1.3);
  // bigger gold feedback for the bonus case so player learns the back-pass mechanic
  if (mult > 1) ringBurst(e.x, e.y, '#facc15', 14);

  // Edge passive — count toward threshold
  const edgeLvl = activePassiveLevel('edge');
  if (edgeLvl > 0){
    game.passive.edge.count++;
    if (game.passive.edge.count >= EDGE_THRESHOLD[edgeLvl-1]){
      game.passive.edge.count = 0;
      game.passive.edge.slowTimer = EDGE_DURATION[edgeLvl-1];
      // visual: arena-wide flash + ring at player
      game.flash = 0.25;
      game.flashColor = '#5ee9ff';
      ringBurst(game.player.x, game.player.y, '#5ee9ff', 22);
    }
  }

  // particle flourish at the enemy
  for (let i=0;i<5;i++){
    const a = Math.random()*TAU;
    const v = rand(40, 100);
    game.particles.push({
      x:e.x, y:e.y,
      vx:Math.cos(a)*v, vy:Math.sin(a)*v,
      life:rand(.25,.45), age:0,
      r:rand(.8,1.4), color:'#5ee9ff'
    });
  }
  // a couple of bright sparkles drifting from enemy toward player
  const p = game.player;
  for (let i=0;i<2;i++){
    const t = (i+1)/3;
    game.particles.push({
      x: lerp(e.x, p.x, t),
      y: lerp(e.y, p.y, t),
      vx: rand(-12,12), vy: rand(-30,-15),
      life:.45, age:0,
      r:1.1, color:'#ffffff'
    });
  }
}

// ===== orbs =====
function spawnOrb(type){
  const def = ORB[type];
  // bias toward periphery (50-85% of arena radius), but not on top of player
  const p = game.player;
  let bestX, bestY, bestScore = -1;
  for (let attempt = 0; attempt < 6; attempt++){
    const ang = Math.random() * TAU;
    const distFrac = rand(0.50, 0.85);
    const r = (game.arena.radius - def.radius - 4) * distFrac;
    const x = CX + Math.cos(ang) * r;
    const y = CY + Math.sin(ang) * r;
    // score by distance from player (we want some, not too much)
    const dp = p ? dist(x, y, p.x, p.y) : 999;
    const score = dp < 30 ? -1 : dp;       // never within 30px of player
    if (score > bestScore){ bestScore = score; bestX = x; bestY = y; }
  }
  if (bestScore < 0){
    // fallback — couldn't find clean spot, just use opposite side from player
    const ang = p ? Math.atan2(p.y - CY, p.x - CX) + Math.PI : Math.random() * TAU;
    const r = (game.arena.radius - def.radius - 4) * 0.65;
    bestX = CX + Math.cos(ang) * r;
    bestY = CY + Math.sin(ang) * r;
  }
  game.orbs.push({
    type, x: bestX, y: bestY,
    radius: def.radius,
    age: 0,
    state: 'fadeIn',
    stateTime: 0,
  });
}

function updateOrbs(dt){
  // FAMINE modifier: orbs only spawn in the last 10s of each wave. Per-wave (not per-run)
  // so 60s/90s modes get a drought-then-relief rhythm instead of an 80-second starve.
  const orbWindow = !game.modifierOrbBlock || (game.waveTimeLeft || game.timeLeft) <= 10;
  // spawn timers
  game.cyanOrbTimer -= dt;
  game.whiteOrbTimer -= dt;
  if (orbWindow && game.cyanOrbTimer <= 0){
    spawnOrb('cyan');
    game.cyanOrbTimer = rand(4.5, 6.5);
  }
  if (orbWindow && game.whiteOrbTimer <= 0){
    spawnOrb('white');
    game.whiteOrbTimer = rand(13, 18);
  }
  // gold: 25% chance once per run, somewhere between 12s elapsed and 8s remaining
  if (orbWindow && !game.goldOrbSpawned && (game.runDuration - game.timeLeft) > 12 && game.timeLeft > 8){
    if (Math.random() < 0.012){  // ~25% over the eligible window
      spawnOrb('gold');
      game.goldOrbSpawned = true;
    }
  }

  const p = game.player;
  for (let i = game.orbs.length - 1; i >= 0; i--){
    const o = game.orbs[i];
    const def = ORB[o.type];
    o.age += dt;
    o.stateTime += dt;

    if (o.state === 'fadeIn' && o.stateTime >= def.fadeIn){
      o.state = 'live';
      o.stateTime = 0;
    } else if (o.state === 'live' && o.stateTime >= def.lifetime){
      o.state = 'fadeOut';
      o.stateTime = 0;
    } else if (o.state === 'fadeOut' && o.stateTime >= def.fadeOut){
      game.orbs.splice(i, 1);
      continue;
    }

    // pickup: generous radius, only while not fading out
    if (o.state !== 'fadeOut' && p.hp > 0){
      const cd = dist(o.x, o.y, p.x, p.y);
      if (cd < o.radius + p.radius + 4){
        collectOrb(o);
        game.orbs.splice(i, 1);
      }
    }
  }
}

function collectOrb(o){
  const p = game.player;
  if (o.type === 'cyan'){
    game.runEssence += 1;
    game.cyanCount++;
    orbPickupBurst(o.x, o.y, '#5ee9ff', 12);
  } else if (o.type === 'white'){
    if (p.hp < p.maxHp){
      p.hp += 1;
      p.displayHp = p.hp / p.maxHp;
      game.whiteCount++;
      orbPickupBurst(o.x, o.y, '#ffffff', 18);
      ringBurst(p.x, p.y, '#ffffff', 14);
    } else {
      // already full → essence
      game.runEssence += 3;
      game.whiteCount++;
      orbPickupBurst(o.x, o.y, '#5ee9ff', 16);
    }
  } else if (o.type === 'gold'){
    game.runEssence += 5;
    game.goldCount++;
    p.invuln = Math.max(p.invuln, 3.0);
    p.goldBoost = 3.0;        // 3 second window where score is x3
    orbPickupBurst(o.x, o.y, '#facc15', 24);
    ringBurst(p.x, p.y, '#facc15', 22);
  }

  // ECHO passive — spawn afterimage at pickup location (player's current position is the orb's location)
  const echoLvl = activePassiveLevel('echo');
  if (echoLvl > 0){
    game.passive.echo.afterimages.push({
      x: p.x, y: p.y,
      age: 0,
      life: ECHO_LIFETIME[echoLvl-1],
    });
  }
}

function orbPickupBurst(x, y, color, n){
  for (let i=0;i<n;i++){
    const a = (i/n)*TAU + rand(-0.2,0.2);
    const v = rand(60, 160);
    game.particles.push({
      x, y,
      vx:Math.cos(a)*v, vy:Math.sin(a)*v,
      life:rand(.4,.7), age:0,
      r:rand(1,2), color
    });
  }
  // a couple of star-like sparks
  for (let i=0;i<4;i++){
    game.particles.push({
      x, y,
      vx:rand(-30,30), vy:rand(-100,-40),
      life:.6, age:0, r:1.4, color:'#ffffff'
    });
  }
}

// ===== passive triggers =====
const SLIPSTREAM_INTERVAL = [8, 7, 6];
const SLIPSTREAM_DURATION = [2.0, 2.5, 3.0];
const SLIPSTREAM_SHRINK = [0.30, 0.30, 0.30];

const RESONANCE_BOOST = [0.10, 0.14, 0.18];

const MAGNET_RANGE = [60, 90, 130];
const MAGNET_PULL_SPEED = 90;        // px/s pull when in range

const EDGE_THRESHOLD = [5, 4, 3];
const EDGE_DURATION = [0.6, 0.7, 0.9];
const EDGE_SLOW_FACTOR = 0.30;       // enemies move at 30% speed during slow
const MAX_DENSITY = 12;              // hard cap on active+warning enemies; backstop against late-game chaos

const PULSE_INTERVAL = [12, 10, 8];
const PULSE_RANGE = [120, 140, 160];
const PULSE_PUSH_SPEED = 350;        // px/s outward
const PULSE_PUSH_DURATION = 0.4;     // how long enemies retain push velocity

// Crystal — combo tier required to charge (tier 3 = ×2.0, tier 2 = ×1.5)
const CRYSTAL_REQ_TIER = [3, 2, 2];

const ECHO_LIFETIME = [1.5, 2.0, 2.5];

const GREED_THRESHOLD = [100, 75, 50];
const GREED_SPARKLE_LIFE = 6.0;

function updatePassives(dt){
  const ps = game.passive;
  const p = game.player;

  // SLIPSTREAM — timer-based hitbox shrink
  const slipLvl = activePassiveLevel('slipstream');
  if (slipLvl > 0){
    if (ps.slipstream.active > 0){
      ps.slipstream.active = Math.max(0, ps.slipstream.active - dt);
      if (ps.slipstream.active === 0){
        p.radius = p.baseRadius;
      }
    } else {
      ps.slipstream.timer += dt;
      if (ps.slipstream.timer >= SLIPSTREAM_INTERVAL[slipLvl-1]){
        ps.slipstream.timer = 0;
        ps.slipstream.active = SLIPSTREAM_DURATION[slipLvl-1];
        p.radius = p.baseRadius * (1 - SLIPSTREAM_SHRINK[slipLvl-1]);
        ringBurst(p.x, p.y, '#5ee9ff', 10);
      }
    }
  } else if (p.radius !== p.baseRadius){
    p.radius = p.baseRadius;
  }

  // MAGNET — pulls orbs in range toward player
  const magLvl = activePassiveLevel('magnet');
  if (magLvl > 0){
    const range = MAGNET_RANGE[magLvl-1];
    for (const o of game.orbs){
      if (o.state === 'fadeOut') continue;
      const ddx = p.x - o.x, ddy = p.y - o.y;
      const dd = Math.hypot(ddx, ddy);
      if (dd > 0 && dd < range){
        const pullFrac = 1 - dd/range;
        const pull = MAGNET_PULL_SPEED * pullFrac * dt;
        o.x += (ddx/dd) * pull;
        o.y += (ddy/dd) * pull;
      }
    }
    // also pull greed sparkles in
    if (game.greedSparkles){
      for (const s of game.greedSparkles){
        const ddx = p.x - s.x, ddy = p.y - s.y;
        const dd = Math.hypot(ddx, ddy);
        if (dd > 0 && dd < range){
          const pullFrac = 1 - dd/range;
          const pull = MAGNET_PULL_SPEED * pullFrac * dt;
          s.x += (ddx/dd) * pull;
          s.y += (ddy/dd) * pull;
        }
      }
    }
  }

  // EDGE — slow timer ticks down
  if (ps.edge.slowTimer > 0){
    ps.edge.slowTimer = Math.max(0, ps.edge.slowTimer - dt);
  }

  // PULSE — timer-based outward shockwave
  const pulseLvl = activePassiveLevel('pulse');
  if (pulseLvl > 0){
    ps.pulse.timer += dt;
    if (ps.pulse.timer >= PULSE_INTERVAL[pulseLvl-1]){
      ps.pulse.timer = 0;
      const range = PULSE_RANGE[pulseLvl-1];
      // push enemies within range outward from player
      for (const e of game.enemies){
        if (!e.active) continue;
        const ddx = e.x - p.x, ddy = e.y - p.y;
        const dd = Math.hypot(ddx, ddy);
        if (dd > 0 && dd < range){
          const nx = ddx/dd, ny = ddy/dd;
          // strongest push when closer
          const strength = 1 - dd/range;
          e.vx = nx * PULSE_PUSH_SPEED * (0.5 + strength * 0.5);
          e.vy = ny * PULSE_PUSH_SPEED * (0.5 + strength * 0.5);
        }
      }
      // visual shockwave: a quick ring expansion
      game.pulseEffects = game.pulseEffects || [];
      game.pulseEffects.push({ x: p.x, y: p.y, r: 0, maxR: range, age: 0 });
      ringBurst(p.x, p.y, '#5ee9ff', 16);
    }
  }
  // pulse visual effects decay
  if (game.pulseEffects){
    for (let i = game.pulseEffects.length - 1; i >= 0; i--){
      const fx = game.pulseEffects[i];
      fx.age += dt;
      fx.r = fx.maxR * Math.min(1, fx.age / 0.4);
      if (fx.age > 0.5) game.pulseEffects.splice(i, 1);
    }
  }

  // CRYSTAL — charges when at required combo tier; held until used
  const crystalLvl = activePassiveLevel('crystal');
  if (crystalLvl > 0){
    const reqTier = CRYSTAL_REQ_TIER[crystalLvl-1];
    const cap = crystalLvl >= 3 ? 2 : 1;
    ps.crystal.maxCharges = cap;
    if (ps.crystal.charges < cap && game.combo.tier >= reqTier){
      ps.crystal.charges = cap;
      // soft cyan ring pulse to confirm charge
      ringBurst(p.x, p.y, '#5ee9ff', 8);
    }
  } else {
    ps.crystal.charges = 0;
    ps.crystal.maxCharges = 0;
  }

  // ECHO — afterimages decay; absorb enemy collisions
  if (ps.echo.afterimages.length > 0){
    for (let i = ps.echo.afterimages.length - 1; i >= 0; i--){
      const a = ps.echo.afterimages[i];
      a.age += dt;
      if (a.age >= a.life){
        ps.echo.afterimages.splice(i, 1);
        continue;
      }
      // check collisions with active enemies
      for (let j = game.enemies.length - 1; j >= 0; j--){
        const e = game.enemies[j];
        if (!e.active) continue;
        const cd = dist(e.x, e.y, a.x, a.y);
        if (cd < e.radius + 11){
          // enemy hits the afterimage — destroy enemy, consume afterimage
          burst(e.x, e.y, e.color, 14, 2.5);
          burst(a.x, a.y, '#5ee9ff', 12, 2);
          game.enemies.splice(j, 1);
          ps.echo.afterimages.splice(i, 1);
          break;
        }
      }
    }
  }

  // GREED — drop sparkle every threshold of score earned
  const greedLvl = activePassiveLevel('greed');
  if (greedLvl > 0){
    const thresh = GREED_THRESHOLD[greedLvl-1];
    while (game.runScore >= ps.greed.lastDropAt + thresh){
      ps.greed.lastDropAt += thresh;
      game.greedSparkles.push({
        x: p.x + rand(-8, 8),
        y: p.y + rand(-8, 8),
        age: 0,
        life: GREED_SPARKLE_LIFE,
      });
    }
  }
  // greed sparkles decay + pickup
  if (game.greedSparkles){
    for (let i = game.greedSparkles.length - 1; i >= 0; i--){
      const s = game.greedSparkles[i];
      s.age += dt;
      if (s.age >= s.life){
        game.greedSparkles.splice(i, 1);
        continue;
      }
      const cd = dist(s.x, s.y, p.x, p.y);
      if (cd < p.radius + 8){
        game.runEssence += 1;
        // small white burst
        for (let k=0;k<6;k++){
          const a = Math.random()*TAU;
          const v = rand(40, 90);
          game.particles.push({
            x:s.x, y:s.y,
            vx:Math.cos(a)*v, vy:Math.sin(a)*v,
            life:.4, age:0, r:rand(.6,1.2), color:'#5ee9ff'
          });
        }
        game.greedSparkles.splice(i, 1);
      }
    }
  }
}

// returns true if an enemy should run at slowed speed this frame
function enemySlowed(){
  return game.passive.edge.slowTimer > 0;
}

// dt multiplier from combo tier — high combos make the world feel slower so
// skill is legible without looking at the corner-of-screen multiplier.
// Stacks multiplicatively with Edge slow at the call site.
function comboSlowFactor(){
  const t = game.combo.tier;
  if (t >= 3) return 0.70;  // ×2.0 combo — 30% slower, clearly "in the zone"
  if (t >= 2) return 0.85;  // ×1.5 combo — 15% slower, first noticeable threshold
  return 1;
}

// Resonance modifies effective movement speed in real-time, called from update
function resonanceMultiplier(){
  const lvl = activePassiveLevel('resonance');
  if (lvl > 0 && game.combo.tier >= 2){  // tier 2 = ×1.5
    return 1 + RESONANCE_BOOST[lvl-1];
  }
  return 1;
}

// ===== run lifecycle =====
function startRun(){
  game.scene = 'playing';
  game.paused = false;
  game.player = makePlayer();
  game.arena = { radius: BASE_ARENA_RADIUS };
  game.enemies = [];
  game.particles = [];
  game.trail = [];
  // reset all modifier-driven flags so a previous run's modifier doesn't bleed into this one
  game.modifierEnemyFilter = null;
  game.modifierSpawnMult = 1;
  game.modifierEnemySpeedMult = 1;
  game.modifierMaxDensity = 0;       // 0 = use default MAX_DENSITY
  game.modifierOrbBlock = false;
  game.modifierGlass = false;
  game.modifierNoPassives = false;
  // resolve mode from meta, gated by prestige unlock thresholds (defensive — UI shouldn't allow
  // an unsupported choice but stale localStorage state could have a locked value).
  let dur = meta.preferredMode || 30;
  if (dur === 60 && (meta.prestige || 0) < 6) dur = 30;
  if (dur === 90 && (meta.prestige || 0) < 12) dur = 30;
  if (dur !== 30 && dur !== 60 && dur !== 90) dur = 30;
  game.timeLeft = dur;
  game.runDuration = dur;
  // wave system: each 30-second segment is its own difficulty arc (fresh enemy ramp).
  // wave 2 (60s mode) adds field; wave 3 (90s mode) adds shielded.
  game.wave = 1;
  game.lastWave = 1;
  game.waveTimeLeft = 30;
  game.waveTransitionTimer = 0;
  game.waveLabelTimer = 0;
  game.spawnTimer = 0.45;
  game.runScore = 0;
  game.scoreAccum = 0;
  game.scoreFloat = 0;
  game.scoreMult = 1;
  game.iframeBonus = 0;
  game.spawnRateMult = 1;
  game.mendingLevel = 0;
  game.healed20 = false;
  game.healed10 = false;
  game.shake = 0;
  game.flash = 0;
  game.combo.time = 0;
  game.combo.mult = 1;
  game.combo.tier = 0;
  game.combo.tierFlash = 0;
  game.combo.breakFlash = 0;
  game.nearMissCount = 0;
  game.orbs = [];
  game.cyanOrbTimer = 3.0;     // first cyan ~3s in
  game.whiteOrbTimer = 10.0;   // first white ~10s
  game.goldOrbSpawned = false;
  game.runEssence = 0;
  game.cyanCount = 0;
  game.whiteCount = 0;
  game.goldCount = 0;
  // passive run state — fresh on every run
  game.passive = {
    slipstream: { timer: 0, active: 0 },
    magnet:     { },
    phoenix:    { used: false },
    resonance:  { },
    edge:       { count: 0, slowTimer: 0 },
    pulse:      { timer: 0 },                   // ticks toward next trigger
    crystal:    { charges: 0, maxCharges: 0 },   // hits remaining; max for the level
    echo:       { afterimages: [] },            // {x, y, age, life}
    greed:      { lastDropAt: 0 },              // last score milestone we dropped at
  };
  game.greedSparkles = [];                       // {x, y, age, life}
  applyMetaUpgrades(game.player, game.arena, game);
  // per-run modifier applies AFTER meta upgrades so its effects win conflicts:
  // GLASS overrides Vitality's maxHp, spatial mods scale the post-Voidspace radius.
  if (game.activeModifier && typeof game.activeModifier.apply === 'function'){
    game.activeModifier.apply(game);
  }
  game.player.invuln = 1.0;
  meta.runs++;
}

function endRun(survived){
  if (game.scene !== 'playing' && game.scene !== 'dying') return;
  const elapsed = game.runDuration - game.timeLeft;
  // best descent counts whether you survived or not — dying 55s into a 60s run
  // is a longer descent than surviving a 30s one
  if (elapsed > meta.bestTime) meta.bestTime = elapsed;
  let baseGained = game.runScore;
  if (survived){
    baseGained += Math.floor(500 * game.scoreMult);
  }
  // prestige, modifier, and mode multipliers stack at banking. result screen shows the math.
  const pMult = meta.prestigeMult || 1;
  const mMult = (game.activeModifier && game.activeModifier.scoreMult) || 1;
  const modeMult = game.runDuration === 90 ? 2.0 : game.runDuration === 60 ? 1.5 : 1.0;
  const gained = Math.floor(baseGained * pMult * mMult * modeMult);
  meta.totalScore += gained;
  meta.totalEssence = (meta.totalEssence || 0) + game.runEssence;
  saveMeta();
  game.result.survived = survived;
  game.result.time = elapsed;
  game.result.score = game.runScore;
  game.result.baseGained = baseGained;
  game.result.gained = gained;
  game.result.prestigeMult = pMult;
  game.result.modifier = game.activeModifier;
  game.result.modifierMult = mMult;
  game.result.modeMult = modeMult;
  game.result.runDuration = game.runDuration;
  game.result.nearMisses = game.nearMissCount;
  game.result.essence = game.runEssence;
  game.result.cyan = game.cyanCount;
  game.result.white = game.whiteCount;
  game.result.gold = game.goldCount;
  game.scene = 'result';
  game.resultTimer = 0;
}

// ===== update =====
function update(dt){
  game.t += dt;
  game.shake = Math.max(0, game.shake - dt*30);
  game.flash = Math.max(0, game.flash - dt*3);
  if (game.ascendAnim > 0) game.ascendAnim = Math.max(0, game.ascendAnim - dt);
  if (game.shopMsgTimer > 0) game.shopMsgTimer -= dt;
  if (game.resetTimer > 0){
    game.resetTimer -= dt;
    if (game.resetTimer <= 0){ game.resetState = 0; game.resetTimer = 0; }
  }
  if (game.scene === 'result') game.resultTimer += dt;

  for (const s of stars){ s.tw += s.sp*dt; }

  for (let i=game.particles.length-1; i>=0; i--){
    const p = game.particles[i];
    p.age += dt;
    if (p.age >= p.life){ game.particles.splice(i,1); continue; }
    p.x += p.vx*dt; p.y += p.vy*dt;
    p.vx *= 0.94; p.vy *= 0.94;
  }

  if (game.scene !== 'playing') return;
  if (game.paused) return;

  const p = game.player;

  // damage flash decays after each hit
  if (p.damageFlash > 0){
    p.damageFlash = Math.max(0, p.damageFlash - dt * 2.2);
    if (p.damageFlash === 0) p.recentLostSegment = -1;
  }
  p.displayHp = p.hp / p.maxHp;

  // movement
  let ix = 0, iy = 0;
  if (keys['w']||keys['arrowup']) iy -= 1;
  if (keys['s']||keys['arrowdown']) iy += 1;
  if (keys['a']||keys['arrowleft']) ix -= 1;
  if (keys['d']||keys['arrowright']) ix += 1;
  if (ix||iy){ const m = Math.hypot(ix,iy); ix/=m; iy/=m; }

  // trailing joystick base: when drag exceeds STICK_MAX, slide the base behind the
  // finger with smoothing. Done here (per-frame, dt-corrected) rather than in pointermove
  // so update cadence doesn't depend on pointer event frequency or display refresh rate.
  if (touch.active){
    const tdx = touch.x - touch.bx;
    const tdy = touch.y - touch.by;
    const tlen = Math.hypot(tdx, tdy);
    if (tlen > STICK_MAX){
      const targetBx = touch.x - tdx/tlen * STICK_MAX;
      const targetBy = touch.y - tdy/tlen * STICK_MAX;
      const tk = 1 - Math.pow(0.5, dt*60);   // 0.5/frame at 60fps, equivalent feel at 120Hz
      touch.bx = lerp(touch.bx, targetBx, tk);
      touch.by = lerp(touch.by, targetBy, tk);
    }
  }

  // touch joystick
  if (ix===0 && iy===0 && touch.active){
    let dx = touch.x - touch.bx;
    let dy = touch.y - touch.by;
    const len = Math.hypot(dx, dy);
    const DEADZONE = 6;        // tight — drift from a resting finger is rare with smoothing
    if (len > DEADZONE){
      // map past-deadzone distance to 0..1
      const live = Math.min(STICK_MAX, len) - DEADZONE;
      const fullRange = STICK_MAX - DEADZONE;
      const linear = live / fullRange;
      // mild power curve — close to linear at low end so you respond immediately,
      // still slightly damped to give precision; pow 1.3 felt about right
      const eased = Math.pow(linear, 1.3);
      ix = (dx / len) * eased;
      iy = (dy / len) * eased;
    }
  }

  let speed = p.speed * resonanceMultiplier();

  // velocity smoothing, dt-corrected (0.38/frame at 60fps) so the game feels identical
  // on 120Hz displays — raw per-frame lerp would converge twice as fast there
  const vk = 1 - Math.pow(0.62, dt*60);
  p.vx = lerp(p.vx, ix*speed, vk);
  p.vy = lerp(p.vy, iy*speed, vk);
  p.x += p.vx*dt; p.y += p.vy*dt;

  const dx = p.x-CX, dy = p.y-CY;
  const d = Math.hypot(dx,dy);
  const maxD = game.arena.radius - p.radius;
  if (d > maxD){
    p.x = CX + dx/d * maxD;
    p.y = CY + dy/d * maxD;
  }

  game.trail.push({x:p.x, y:p.y, age:0});
  if (game.trail.length > 16) game.trail.shift();
  for (const t of game.trail) t.age += dt;

  if (p.invuln > 0) p.invuln -= dt;

  // combo update
  const cb = game.combo;
  cb.time += dt;
  let newTier = 0, newMult = 1;
  for (let i = COMBO_TIERS.length - 1; i >= 0; i--){
    if (cb.time >= COMBO_TIERS[i].t){ newTier = i + 1; newMult = COMBO_TIERS[i].mult; break; }
  }
  if (newTier > cb.tier){
    cb.tierFlash = 1;
    ringBurst(p.x, p.y, '#5ee9ff', 14);
  }
  cb.tier = newTier;
  cb.mult = newMult;
  if (cb.tierFlash > 0) cb.tierFlash = Math.max(0, cb.tierFlash - dt * 1.8);
  if (cb.breakFlash > 0) cb.breakFlash = Math.max(0, cb.breakFlash - dt * 1.6);

  // run timer + scoring
  game.timeLeft = Math.max(0, game.timeLeft - dt);

  // wave system — recompute current wave from elapsed time. Each wave is its own 30s arc.
  // Wave change triggers a 1.5s transition: spawn timer paused, wave label flashed.
  // maxWave clamp prevents a one-frame wave-2 trigger at the very end of a 30s run.
  const elapsedTotal = game.runDuration - game.timeLeft;
  const maxWave = Math.floor((game.runDuration || 30) / 30);
  const newWave = Math.min(maxWave, Math.floor(elapsedTotal / 30) + 1);
  if (newWave !== game.wave){
    game.lastWave = game.wave;
    game.wave = newWave;
    game.waveTransitionTimer = 1.5;
    game.waveLabelTimer = 1.8;  // slightly longer than transition so it lingers
    game.flash = 0.35;
    game.flashColor = '#facc15';
    ringBurst(CX, CY, '#facc15', 32);
  }
  // effective time-remaining within the current wave (used by unlockedTypes for the difficulty ramp)
  game.waveTimeLeft = 30 - (elapsedTotal - (game.wave - 1) * 30);
  if (game.waveTransitionTimer > 0) game.waveTransitionTimer = Math.max(0, game.waveTransitionTimer - dt);
  if (game.waveLabelTimer > 0) game.waveLabelTimer = Math.max(0, game.waveLabelTimer - dt);
  game.scoreAccum += dt;
  // gold orb adds a x3 score multiplier for 3s after pickup
  if (p.goldBoost > 0) p.goldBoost = Math.max(0, p.goldBoost - dt);
  const goldMult = p.goldBoost > 0 ? 3 : 1;
  const totalMult = game.scoreMult * cb.mult * goldMult;
  while (game.scoreAccum >= 0.1){
    game.scoreAccum -= 0.1;
    game.scoreFloat += totalMult;
  }
  game.runScore = Math.floor(game.scoreFloat);

  // orbs
  updateOrbs(dt);
  // passives (slipstream timer, magnet pull, edge slow tick)
  updatePassives(dt);

  // mid-run heals (mending upgrade)
  if (game.mendingLevel >= 1 && !game.healed20 && game.timeLeft <= 20){
    game.healed20 = true;
    if (p.hp < p.maxHp){
      p.hp++;
      ringBurst(p.x, p.y, '#5ee9ff', 18);
      burst(p.x, p.y, '#ffffff', 10, 2);
    }
  }
  if (game.mendingLevel >= 2 && !game.healed10 && game.timeLeft <= 10){
    game.healed10 = true;
    if (p.hp < p.maxHp){
      p.hp++;
      ringBurst(p.x, p.y, '#5ee9ff', 18);
      burst(p.x, p.y, '#ffffff', 10, 2);
    }
  }

  // spawn
  game.spawnTimer -= dt;
  const tProg = 1 - game.timeLeft/game.runDuration;
  // floor bumped from 0.42 → 0.55 so late-game has a breathable tempo.
  // voidspace still compresses this; density cap below bounds the worst case.
  // tProg now uses wave-local progress so each wave's spawn ramp resets fresh.
  const waveTProg = 1 - (game.waveTimeLeft || game.timeLeft) / 30;
  const baseInterval = clamp(0.85 - waveTProg*0.43, 0.55, 0.95);
  const interval = baseInterval / ((game.spawnRateMult || 1) * (game.modifierSpawnMult || 1));
  // density cap: modifier override → wave-based default ([12, 14, 16] for waves 1/2/3) → MAX_DENSITY fallback.
  const waveCap = [12, 14, 16][(game.wave || 1) - 1] || MAX_DENSITY;
  const cap = game.modifierMaxDensity || waveCap;
  // skip spawn block during the brief wave-transition breath so the player gets a moment between waves
  if (game.waveTransitionTimer <= 0 && game.spawnTimer <= 0 && game.timeLeft > 0.3){
    if (game.enemies.length >= cap){
      // capped — quick retry once enemies die or leave the arena.
      game.spawnTimer = 0.15;
    } else {
      spawnEnemy();
      // bonus rolls also density-gated so a near-cap state doesn't punch +2 through.
      if (waveTProg > 0.30 && Math.random() < 0.30 && game.enemies.length < cap) spawnEnemy();
      if (waveTProg > 0.65 && Math.random() < 0.35 && game.enemies.length < cap) spawnEnemy();
      game.spawnTimer = interval * rand(0.85, 1.15);
    }
  }

  // enemies
  for (let i=game.enemies.length-1; i>=0; i--){
    const e = game.enemies[i];
    if (!e.active){
      e.warning -= dt;
      if (e.warning <= 0){
        e.active = true;
        e.born = true;
        ringBurst(e.x, e.y, e.color, e.type==='sniper' ? 18 : 10);
      }
      continue;
    }
    let eDt = dt * comboSlowFactor();
    if (enemySlowed()) eDt *= EDGE_SLOW_FACTOR;
    e.behavior(e, eDt, p);
    e.age += dt;

    if (e.type === 'tracker' || e.type === 'sniper'){
      if (Math.random() < 0.5){
        game.particles.push({x:e.x+rand(-2,2), y:e.y+rand(-2,2), vx:0, vy:0, life:.3, age:0, r:rand(.6,1.4), color:e.color});
      }
    }

    if (e.dead){ game.enemies.splice(i,1); continue; }

    // collision + near-miss tracking
    const cd = dist(e.x, e.y, p.x, p.y);
    const collisionDist = e.radius + p.radius;
    const margin = cd - collisionDist;

    if (p.invuln <= 0 && margin < 0){
      damagePlayer();
      burst(e.x, e.y, e.color, 14, 2);
      const ang = Math.atan2(e.y-p.y, e.x-p.x);
      e.vx = Math.cos(ang)*200; e.vy = Math.sin(ang)*200;
    } else if (!e.creditedNear){
      // track minimum margin observed; credit when enemy moves clearly away after coming close
      if (e.minMargin === undefined) e.minMargin = margin;
      else if (margin < e.minMargin) e.minMargin = margin;
      if (e.minMargin > 0 && e.minMargin < NEAR_MISS_PX && margin > NEAR_MISS_PX){
        // SHIELDED — direction-aware. Compute angle from enemy to player relative to enemy's
        // velocity (the shield's facing). Front cone (±60°) blocks credit; back-pass earns 2x.
        if (e.type === 'shielded'){
          const enemyToPlayer = Math.atan2(p.y - e.y, p.x - e.x);
          const facingDir = Math.atan2(e.vy, e.vx);
          let angleDiff = enemyToPlayer - facingDir;
          while (angleDiff > Math.PI) angleDiff -= TAU;
          while (angleDiff < -Math.PI) angleDiff += TAU;
          e.creditedNear = true;
          if (Math.abs(angleDiff) >= Math.PI/3) awardNearMiss(e, 2);  // back-side only
        } else {
          e.creditedNear = true;
          awardNearMiss(e);
        }
      }
    }

    if (dist(e.x, e.y, CX, CY) > game.arena.radius + 240){
      game.enemies.splice(i,1);
    }
  }

  if (game.timeLeft <= 0){
    endRun(true);
  }
}

function damagePlayer(){
  const p = game.player;
  if (p.invuln > 0) return;

  // CRYSTAL — absorbs the hit if charged. No HP loss, no combo break, brief invuln.
  if (game.passive.crystal.charges > 0){
    game.passive.crystal.charges--;
    p.invuln = 0.5;
    game.shake = 4;
    game.flash = 0.25;
    game.flashColor = '#5ee9ff';
    // shimmer burst — implies the crystal shattered
    ringBurst(p.x, p.y, '#5ee9ff', 26);
    burst(p.x, p.y, '#ffffff', 14, 2);
    return;
  }

  p.hp--;
  p.recentLostSegment = p.hp; // 0-indexed: segment that just emptied
  p.damageFlash = 1;
  p.displayHp = p.hp / p.maxHp;
  p.invuln = 0.95 + game.iframeBonus;
  game.shake = 8;
  game.flash = 0.45;
  game.flashColor = '#ff6b8a';
  // combo partial-break — drop one tier per hit instead of zeroing.
  // keeps recovery possible without making hits painless: high-tier runs still
  // cost real time to (re)build, sloppy runs still pay a real per-hit cost.
  if (game.combo.tier > 0){
    game.combo.breakFlash = 1;
    const newTier = game.combo.tier - 1;
    game.combo.tier = newTier;
    if (newTier === 0){
      game.combo.time = 0;
      game.combo.mult = 1;
    } else {
      const tdef = COMBO_TIERS[newTier - 1];
      game.combo.time = tdef.t;
      game.combo.mult = tdef.mult;
    }
  }
  ringBurst(p.x, p.y, '#ff6b8a', 22);
  if (p.hp <= 0){
    // Phoenix passive — intercept death once per run
    const phoenixLvl = activePassiveLevel('phoenix');
    if (phoenixLvl > 0 && !game.passive.phoenix.used){
      game.passive.phoenix.used = true;
      const reviveHP = [1, 2, 2][phoenixLvl-1];
      const invulnDur = [1.5, 2.0, 2.5][phoenixLvl-1];
      p.hp = Math.min(reviveHP, p.maxHp);
      p.displayHp = p.hp / p.maxHp;
      p.invuln = invulnDur;
      // celebratory burst
      ringBurst(p.x, p.y, '#facc15', 28);
      burst(p.x, p.y, '#facc15', 22, 3);
      burst(p.x, p.y, '#ffffff', 14, 2);
      game.flash = 0.5;
      game.flashColor = '#facc15';
      return;
    }
    p.hp = 0;
    burst(p.x, p.y, '#5ee9ff', 36, 4);
    burst(p.x, p.y, '#ffffff', 18, 3);
    game.scene = 'dying';
    setTimeout(()=>{ if (game.scene === 'dying') endRun(false); }, 500);
  }
}

// ===== render =====
function render(){
  ctx.fillStyle = '#060810';
  ctx.fillRect(0,0,W,H);

  let sx=0, sy=0;
  if (game.shake > 0){
    sx = rand(-1,1)*game.shake*0.4;
    sy = rand(-1,1)*game.shake*0.4;
  }
  ctx.save();
  ctx.translate(sx, sy);

  drawStars();
  game.buttonHits.length = 0;

  if (game.scene === 'menu'){
    drawArenaBackdrop();
    drawArena(false);
    drawMenu();
  } else if (game.scene === 'shop'){
    drawArenaBackdrop();
    drawArena(false);
    drawShop();
  } else if (game.scene === 'modifierPick'){
    drawArenaBackdrop();
    drawArena(false);
    drawModifierPick();
  } else {
    drawArenaBackdrop();
    drawArena(true);
    drawTrail();
    drawPassiveEffects();
    drawOrbs();
    drawEnemies();
    drawWarnings();
    drawParticles();
    drawPlayer();
    if (!game.paused) drawJoystick();
    if (game.scene === 'playing' || game.scene === 'dying' || game.scene === 'result') drawHUD();
    if (game.scene === 'result') drawResult();
    if (game.scene === 'playing' && !game.paused) drawPauseButton();
    if (game.paused) drawPauseOverlay();
  }

  ctx.restore();
  drawFlash();
}

function drawStars(){
  for (const s of stars){
    const a = 0.3 + 0.5*(0.5+0.5*Math.sin(s.tw));
    ctx.globalAlpha = a*s.p;
    ctx.fillStyle = '#cfd8ff';
    ctx.beginPath();
    ctx.arc(s.x*W, s.y*H, s.r, 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawArenaBackdrop(){
  const r = game.arena.radius;
  const grad = ctx.createRadialGradient(CX, CY, r*0.5, CX, CY, r*1.5);
  grad.addColorStop(0, 'rgba(94,233,255,0.0)');
  grad.addColorStop(0.7, 'rgba(94,233,255,0.04)');
  grad.addColorStop(1, 'rgba(94,233,255,0.0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);
}

function drawArena(showTimer){
  const r = game.arena.radius;
  const grad = ctx.createRadialGradient(CX, CY, 0, CX, CY, r);
  grad.addColorStop(0, 'rgba(20,28,55,0.0)');
  grad.addColorStop(0.85, 'rgba(20,28,55,0.18)');
  grad.addColorStop(1, 'rgba(94,127,214,0.18)');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(CX, CY, r, 0, TAU);
  ctx.fill();

  ctx.shadowColor = 'rgba(94,233,255,0.7)';
  ctx.shadowBlur = 22;
  ctx.strokeStyle = 'rgba(94,233,255,0.4)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(CX, CY, r, 0, TAU);
  ctx.stroke();
  ctx.shadowBlur = 0;

  ctx.strokeStyle = 'rgba(186,230,253,0.85)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(CX, CY, r-0.5, 0, TAU);
  ctx.stroke();

  // rotating reticle ticks outside the boundary
  const ticks = 60;
  const rot = game.t * 0.05;
  for (let i=0;i<ticks;i++){
    const a = (i/ticks)*TAU + rot;
    const major = i % 5 === 0;
    const len = major ? 12 : 4;
    const x1 = CX + Math.cos(a)*(r+5);
    const y1 = CY + Math.sin(a)*(r+5);
    const x2 = CX + Math.cos(a)*(r+5+len);
    const y2 = CY + Math.sin(a)*(r+5+len);
    ctx.strokeStyle = major ? 'rgba(94,233,255,0.55)' : 'rgba(94,233,255,0.18)';
    ctx.lineWidth = major ? 1.2 : 0.8;
    ctx.beginPath();
    ctx.moveTo(x1,y1); ctx.lineTo(x2,y2);
    ctx.stroke();
  }

  if (showTimer){
    const frac = clamp(game.timeLeft / game.runDuration, 0, 1);
    const angStart = -Math.PI/2;
    const danger = game.timeLeft < 8;
    ctx.strokeStyle = danger ? 'rgba(255,154,63,0.8)' : 'rgba(94,233,255,0.7)';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(CX, CY, r-10, angStart, angStart + frac*TAU);
    ctx.stroke();
    ctx.lineCap = 'butt';
  }
}

function drawTrail(){
  if (!game.player) return;
  for (let i=0;i<game.trail.length;i++){
    const t = game.trail[i];
    const a = (i / game.trail.length) * 0.45;
    ctx.globalAlpha = a;
    ctx.fillStyle = '#5ee9ff';
    ctx.beginPath();
    ctx.arc(t.x, t.y, game.player.radius * (i/game.trail.length) * 0.85, 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawPlayer(){
  if (!game.player) return;
  const p = game.player;
  if (p.hp <= 0 && game.scene === 'dying') return;

  // Magnet range — visible only while player has the passive equipped (faint dotted ring)
  const magLvl = activePassiveLevel('magnet');
  if (magLvl > 0){
    const range = MAGNET_RANGE[magLvl-1];
    ctx.strokeStyle = `rgba(94,233,255,${0.10 + 0.05*Math.sin(game.t*1.5)})`;
    ctx.lineWidth = 1;
    ctx.setLineDash([2, 6]);
    ctx.beginPath();
    ctx.arc(p.x, p.y, range, 0, TAU);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // Slipstream active — pulsing cyan aura close around player to show "you're smaller right now"
  if (game.passive && game.passive.slipstream && game.passive.slipstream.active > 0){
    const s = game.passive.slipstream.active;
    const slipLvl = activePassiveLevel('slipstream') || 1;
    const max = SLIPSTREAM_DURATION[slipLvl-1];
    const intensity = clamp(s / max, 0, 1);
    const auraR = p.radius + 6 + 2*Math.sin(game.t*8);
    const grad = ctx.createRadialGradient(p.x, p.y, p.radius, p.x, p.y, auraR + 8);
    grad.addColorStop(0, `rgba(94,233,255,${0.5 * intensity})`);
    grad.addColorStop(1, `rgba(94,233,255,0)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(p.x, p.y, auraR + 8, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = `rgba(94,233,255,${0.55 * intensity})`;
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.arc(p.x, p.y, auraR, 0, TAU);
    ctx.stroke();
  }

  // Crystal shield — faceted cyan ring(s) around player, one per charge
  if (game.passive && game.passive.crystal && game.passive.crystal.charges > 0){
    const charges = game.passive.crystal.charges;
    const facets = 6;
    const baseR = p.radius + 9;
    for (let c = 0; c < charges; c++){
      const ringR = baseR + c * 4;     // outer ring spaced from inner
      const wobble = 1.5 * Math.sin(game.t * 4 + c * 1.7);
      const rot = game.t * 0.6 + c * 0.5;
      ctx.strokeStyle = `rgba(94,233,255,${0.65 + 0.2*Math.sin(game.t*5 + c)})`;
      ctx.lineWidth = 1.4;
      ctx.shadowColor = '#5ee9ff';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      for (let i=0;i<=facets;i++){
        const a = (i/facets) * TAU + rot;
        const r = ringR + (i%2===0 ? wobble : -wobble);
        const x = p.x + Math.cos(a) * r;
        const y = p.y + Math.sin(a) * r;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
      ctx.shadowBlur = 0;
    }
  }

  // prestige aura — subtle gold halo unlocked at rank 3, intensifies with higher ranks.
  // drawn under the combo aura so they layer cleanly when a high-prestige player gets a combo.
  const prank = meta.prestige || 0;
  if (prank >= 3){
    const intensity = Math.min(1, (prank - 2) / 7);  // smooth ramp from rank 3 to rank ~10
    const pulse = 0.7 + 0.3 * Math.sin(game.t * 1.8);
    const auraR = p.radius + 22 + intensity * 5;
    const grad = ctx.createRadialGradient(p.x, p.y, p.radius - 2, p.x, p.y, auraR);
    grad.addColorStop(0, `rgba(250,204,21,${0.10 * intensity * pulse})`);
    grad.addColorStop(0.7, `rgba(250,204,21,${0.04 * intensity * pulse})`);
    grad.addColorStop(1, 'rgba(250,204,21,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(p.x, p.y, auraR, 0, TAU);
    ctx.fill();
  }

  // combo aura — drawn beneath everything so it feels like a presence around you
  const cb = game.combo;
  if (cb.tier >= 2){
    const auraR = p.radius + 14 + (cb.tier === 3 ? 6 + 3*Math.sin(game.t*5) : 0);
    const auraColor = cb.tier === 3 ? '255,210,74' : '94,233,255';
    const grad = ctx.createRadialGradient(p.x, p.y, p.radius, p.x, p.y, auraR);
    grad.addColorStop(0, `rgba(${auraColor},0)`);
    grad.addColorStop(0.6, `rgba(${auraColor},0.10)`);
    grad.addColorStop(1, `rgba(${auraColor},0)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(p.x, p.y, auraR, 0, TAU);
    ctx.fill();
    // thin pulsing ring at tier 3
    if (cb.tier === 3){
      ctx.strokeStyle = `rgba(${auraColor},${0.25 + 0.15*Math.sin(game.t*5)})`;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(p.x, p.y, auraR - 3, 0, TAU);
      ctx.stroke();
    }
  }

  const flicker = p.invuln > 0 ? (Math.sin(game.t*30) > 0 ? 0.6 : 1) : 1;
  ctx.globalAlpha = flicker;

  const segs = Math.max(1, p.maxHp);
  const segArc = TAU / segs;
  // narrower gap when many segments so they stay readable
  const gap = Math.min(0.12, segArc * 0.18);

  // soft halo behind the whole ring (gives the cyan glow at all HP states)
  ctx.shadowColor = '#5ee9ff';
  ctx.shadowBlur = 18;
  ctx.strokeStyle = 'rgba(94,233,255,0.20)';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.arc(p.x, p.y, p.radius, 0, TAU);
  ctx.stroke();
  ctx.shadowBlur = 0;

  // segments: filled = HP remaining, faded = lost, recently-lost flashes red
  for (let i=0;i<segs;i++){
    const a1 = -Math.PI/2 + i * segArc + gap/2;
    const a2 = -Math.PI/2 + (i+1) * segArc - gap/2;
    const filled = i < p.hp;
    const justLost = !filled && (i === p.recentLostSegment) && p.damageFlash > 0;

    if (justLost){
      const f = p.damageFlash;
      ctx.shadowColor = '#ff6b8a';
      ctx.shadowBlur = 18 * f;
      ctx.strokeStyle = `rgba(255,107,138,${0.25 + 0.75*f})`;
      ctx.lineWidth = 2.5 + 2 * f;
    } else if (filled){
      ctx.shadowColor = 'transparent';
      ctx.shadowBlur = 0;
      ctx.strokeStyle = '#5ee9ff';
      ctx.lineWidth = 2.8;
    } else {
      ctx.shadowColor = 'transparent';
      ctx.shadowBlur = 0;
      ctx.strokeStyle = 'rgba(94,233,255,0.15)';
      ctx.lineWidth = 1.4;
    }
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.radius, a1, a2);
    ctx.stroke();
  }
  ctx.shadowBlur = 0;

  // inner core: scales with HP/maxHp instantly, tints red briefly on hit
  const innerR = p.radius * 0.62 * (p.hp / p.maxHp);
  if (innerR > 0.5){
    const f = p.damageFlash;
    if (f > 0){
      ctx.shadowColor = '#ff6b8a';
      ctx.shadowBlur = 14 + f*8;
      const g = Math.floor(255 - f*148);
      const b = Math.floor(255 - f*117);
      ctx.fillStyle = `rgb(255, ${g}, ${b})`;
    } else {
      ctx.shadowColor = '#ffffff';
      ctx.shadowBlur = 12;
      ctx.fillStyle = '#ffffff';
    }
    ctx.beginPath();
    ctx.arc(p.x, p.y, innerR, 0, TAU);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  ctx.globalAlpha = 1;
}

function drawJoystick(){
  if (!touch.active) return;
  // outer base ring
  ctx.globalAlpha = 0.55;
  ctx.fillStyle = 'rgba(15,20,35,0.45)';
  ctx.beginPath();
  ctx.arc(touch.bx, touch.by, STICK_MAX, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = 'rgba(232,235,242,0.55)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(touch.bx, touch.by, STICK_MAX, 0, TAU);
  ctx.stroke();
  // tiny center dot
  ctx.fillStyle = 'rgba(232,235,242,0.35)';
  ctx.beginPath();
  ctx.arc(touch.bx, touch.by, 2, 0, TAU);
  ctx.fill();
  ctx.globalAlpha = 1;

  // stick knob (clamped)
  let dx = touch.x - touch.bx;
  let dy = touch.y - touch.by;
  const len = Math.hypot(dx, dy);
  if (len > STICK_MAX){ dx = dx/len*STICK_MAX; dy = dy/len*STICK_MAX; }
  const sx = touch.bx + dx, sy = touch.by + dy;

  ctx.shadowColor = '#5ee9ff';
  ctx.shadowBlur = 16;
  ctx.fillStyle = 'rgba(94,233,255,0.6)';
  ctx.beginPath();
  ctx.arc(sx, sy, 26, 0, TAU);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = '#5ee9ff';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(sx, sy, 26, 0, TAU);
  ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.beginPath();
  ctx.arc(sx, sy, 5, 0, TAU);
  ctx.fill();
}

function drawOrbs(){
  for (const o of game.orbs){
    const def = ORB[o.type];
    // alpha based on state
    let alpha = 1;
    if (o.state === 'fadeIn'){
      alpha = clamp(o.stateTime / def.fadeIn, 0, 1);
    } else if (o.state === 'fadeOut'){
      alpha = 1 - clamp(o.stateTime / def.fadeOut, 0, 1);
    }
    // urgency: when over half through lifetime, accelerate the pulse and add flicker
    let urgency = 0;
    if (o.state === 'live'){
      const half = def.lifetime * 0.5;
      if (o.stateTime > half){
        urgency = (o.stateTime - half) / (def.lifetime - half);
      }
    } else if (o.state === 'fadeOut'){
      urgency = 1;
    }
    const pulseHz = def.pulseSpeed + urgency * 6;
    const pulse = 0.5 + 0.5 * Math.sin(o.age * pulseHz);
    // late-stage flicker
    let flicker = 1;
    if (urgency > 0.5){
      flicker = 0.7 + 0.3 * (Math.sin(o.age * 22) > 0 ? 1 : 0);
    }

    ctx.globalAlpha = alpha * flicker;

    // outer glow halo (sets the orb apart from solid enemies)
    const haloR = o.radius + 6 + pulse * 3;
    const grad = ctx.createRadialGradient(o.x, o.y, o.radius, o.x, o.y, haloR);
    grad.addColorStop(0, def.color + '00');
    grad.addColorStop(0.5, def.color + '44');
    grad.addColorStop(1, def.color + '00');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(o.x, o.y, haloR, 0, TAU);
    ctx.fill();

    // hollow outer ring — the visual signature
    ctx.shadowColor = def.color;
    ctx.shadowBlur = 12;
    ctx.strokeStyle = def.color;
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.arc(o.x, o.y, o.radius, 0, TAU);
    ctx.stroke();
    ctx.shadowBlur = 0;

    // rotating orbit ring (different from enemy bouncer dashes)
    const orbitR = o.radius + 3;
    const orbitAng = o.age * (o.type === 'gold' ? 2.5 : 1.6);
    ctx.strokeStyle = def.color;
    ctx.globalAlpha = alpha * flicker * 0.4;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(o.x, o.y, orbitR, orbitAng, orbitAng + Math.PI * 0.6);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(o.x, o.y, orbitR, orbitAng + Math.PI, orbitAng + Math.PI * 1.6);
    ctx.stroke();
    ctx.globalAlpha = alpha * flicker;

    // inner pulsing core dot
    const coreR = (o.type === 'gold' ? 3.5 : 2.8) * (0.6 + pulse * 0.5);
    ctx.fillStyle = def.color;
    ctx.beginPath();
    ctx.arc(o.x, o.y, coreR, 0, TAU);
    ctx.fill();

    // symbol — pure white, centered
    ctx.fillStyle = '#ffffff';
    ctx.font = '300 11px "Fraunces",serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(def.symbol, o.x, o.y + 0.5);
    ctx.textBaseline = 'alphabetic';
  }
  ctx.globalAlpha = 1;
}

function drawPassiveEffects(){
  // Pulse shockwaves — expanding rings from player
  if (game.pulseEffects){
    for (const fx of game.pulseEffects){
      const fade = clamp(1 - fx.age / 0.5, 0, 1);
      ctx.strokeStyle = `rgba(94,233,255,${0.7 * fade})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(fx.x, fx.y, fx.r, 0, TAU);
      ctx.stroke();
      ctx.strokeStyle = `rgba(94,233,255,${0.3 * fade})`;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(fx.x, fx.y, fx.r * 0.85, 0, TAU);
      ctx.stroke();
    }
  }

  // Echo afterimages — subtle ghost player markers
  if (game.passive && game.passive.echo && game.passive.echo.afterimages.length > 0){
    for (const a of game.passive.echo.afterimages){
      const lifeFrac = clamp(1 - a.age / a.life, 0, 1);
      const flicker = 0.5 + 0.5 * Math.sin(a.age * 14);
      const alpha = lifeFrac * (0.4 + 0.3 * flicker);
      ctx.shadowColor = '#5ee9ff';
      ctx.shadowBlur = 10 * lifeFrac;
      ctx.strokeStyle = `rgba(94,233,255,${alpha})`;
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.arc(a.x, a.y, 11, 0, TAU);
      ctx.stroke();
      ctx.shadowBlur = 0;
      // inner core
      ctx.fillStyle = `rgba(255,255,255,${alpha * 0.5})`;
      ctx.beginPath();
      ctx.arc(a.x, a.y, 4 * lifeFrac, 0, TAU);
      ctx.fill();
    }
  }

  // Greed sparkles — small bobbing diamonds, fade in last second
  if (game.greedSparkles && game.greedSparkles.length > 0){
    for (const s of game.greedSparkles){
      const remain = s.life - s.age;
      const fadeAlpha = remain < 1.2 ? remain / 1.2 : 1;
      const bob = Math.sin(s.age * 4 + s.x * 0.05) * 1.5;
      const pulse = 0.6 + 0.4 * Math.sin(s.age * 6);
      ctx.globalAlpha = fadeAlpha;
      ctx.shadowColor = '#5ee9ff';
      ctx.shadowBlur = 8 * pulse;
      ctx.fillStyle = '#5ee9ff';
      // little diamond
      const sx = s.x, sy = s.y + bob;
      const r = 3 + pulse * 1.2;
      ctx.beginPath();
      ctx.moveTo(sx, sy - r);
      ctx.lineTo(sx + r, sy);
      ctx.lineTo(sx, sy + r);
      ctx.lineTo(sx - r, sy);
      ctx.closePath();
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(sx, sy, 1.2, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
}

function drawEnemies(){
  for (const e of game.enemies){
    if (!e.active) continue;

    // FIELD — damage zone visual: outline ring + translucent fill + center marker.
    // During fading phase, fade alpha and use the remembered visual radius.
    if (e.type === 'field'){
      const fadeAlpha = e.zonePhase === 'fading' ? Math.max(0, 1 - e.phaseTime/0.5) : 1;
      const visR = e.zoneVisualRadius || e.radius;
      const pulse = 0.4 + 0.2 * Math.sin(game.t * 4);
      ctx.strokeStyle = `rgba(251,146,60,${0.6 * fadeAlpha})`;
      ctx.lineWidth = 2;
      ctx.shadowColor = e.color;
      ctx.shadowBlur = 12 * fadeAlpha;
      ctx.beginPath();
      ctx.arc(e.x, e.y, visR, 0, TAU);
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.fillStyle = `rgba(251,146,60,${0.18 * pulse * fadeAlpha})`;
      ctx.beginPath();
      ctx.arc(e.x, e.y, visR, 0, TAU);
      ctx.fill();
      ctx.fillStyle = `rgba(255,224,180,${0.9 * fadeAlpha})`;
      ctx.beginPath();
      ctx.arc(e.x, e.y, 4, 0, TAU);
      ctx.fill();
      continue;
    }

    // SHIELDED — body + thick shield arc on the front (facing velocity).
    if (e.type === 'shielded'){
      ctx.shadowColor = e.color;
      ctx.shadowBlur = 12;
      ctx.fillStyle = e.color;
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.radius, 0, TAU);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.radius*0.55, 0, TAU);
      ctx.fill();
      const faceAng = Math.atan2(e.vy, e.vx);
      const shieldR = e.radius + 4;
      ctx.strokeStyle = '#fff7c2';
      ctx.lineWidth = 2.5;
      ctx.shadowColor = e.color;
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(e.x, e.y, shieldR, faceAng - Math.PI/3, faceAng + Math.PI/3);
      ctx.stroke();
      ctx.shadowBlur = 0;
      continue;
    }

    ctx.shadowColor = e.color;
    ctx.shadowBlur = 16;
    ctx.fillStyle = e.color;
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.radius, 0, TAU);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.radius*0.55, 0, TAU);
    ctx.fill();
    if (e.type === 'bouncer'){
      ctx.strokeStyle = e.color;
      ctx.lineWidth = 1;
      ctx.setLineDash([2,2]);
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.radius+4, 0, TAU);
      ctx.stroke();
      ctx.setLineDash([]);
    }
  }
}

function drawWarnings(){
  for (const e of game.enemies){
    if (e.active) continue;
    const t = 1 - e.warning / e.warningMax;
    const pulse = 0.4 + 0.6*Math.abs(Math.sin(game.t*10));
    // FIELD warning — strong outline ring at full zone radius. Player needs to clearly see
    // where the damage zone will be so they have time to vacate.
    if (e.type === 'field'){
      const fastPulse = 0.5 + 0.5*Math.abs(Math.sin(game.t*8));
      ctx.strokeStyle = `rgba(251,146,60,${0.30 + 0.50*fastPulse*t})`;
      ctx.lineWidth = 2;
      ctx.setLineDash([5,5]);
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.radius, 0, TAU);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = `rgba(251,146,60,${0.06 + 0.08*t})`;
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.radius, 0, TAU);
      ctx.fill();
      ctx.fillStyle = `rgba(255,224,180,${0.5 + 0.4*t})`;
      ctx.beginPath();
      ctx.arc(e.x, e.y, 3, 0, TAU);
      ctx.fill();
      continue;
    }
    const ang = Math.atan2(e.vy, e.vx);
    if (e.type === 'sniper'){
      const ex = e.x + Math.cos(ang)*1400;
      const ey = e.y + Math.sin(ang)*1400;
      ctx.strokeStyle = `rgba(239,68,68,${0.18 + 0.5*pulse*t})`;
      ctx.lineWidth = 2;
      ctx.setLineDash([6,4]);
      ctx.beginPath();
      ctx.moveTo(e.x, e.y); ctx.lineTo(ex, ey);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.strokeStyle = `rgba(239,68,68,${0.6 + 0.3*pulse})`;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.radius * (1 + (1-t)*0.8), 0, TAU);
      ctx.stroke();
    } else {
      const len = 110;
      const ex = e.x + Math.cos(ang)*len;
      const ey = e.y + Math.sin(ang)*len;
      ctx.strokeStyle = `rgba(255,230,109,${0.22 + 0.4*pulse*t})`;
      ctx.lineWidth = 1;
      ctx.setLineDash([4,5]);
      ctx.beginPath();
      ctx.moveTo(e.x, e.y); ctx.lineTo(ex, ey);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.strokeStyle = `rgba(255,230,109,${0.4+0.5*pulse})`;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.radius*(1+(1-t)*0.6), 0, TAU);
      ctx.stroke();
    }
  }
}

function drawParticles(){
  for (const p of game.particles){
    const a = 1 - p.age/p.life;
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawPauseButton(){
  // small unobtrusive icon in the top-left corner
  // sized to fit above the essence display (which baselines at y=36)
  const x = 10, y = 8, size = 24;
  const cx = x + size/2, cy = y + size/2;
  const hov = mx>=x && mx<=x+size && my>=y && my<=y+size;

  ctx.fillStyle = hov ? 'rgba(232,235,242,0.08)' : 'rgba(15,20,35,0.4)';
  ctx.strokeStyle = hov ? 'rgba(232,235,242,0.7)' : 'rgba(232,235,242,0.28)';
  ctx.lineWidth = 1;
  roundRect(x, y, size, size, 4);
  ctx.fill();
  ctx.stroke();

  // pause symbol — two thin vertical bars
  ctx.fillStyle = hov ? '#e8ebf2' : 'rgba(232,235,242,0.6)';
  const barW = 2.2, barH = 10, gap = 3;
  ctx.fillRect(cx - gap/2 - barW, cy - barH/2, barW, barH);
  ctx.fillRect(cx + gap/2,        cy - barH/2, barW, barH);

  game.buttonHits.push({ x, y, w:size, h:size, action: pauseGame });
}

function drawPauseOverlay(){
  // dim layer
  ctx.fillStyle = 'rgba(6,8,16,0.78)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#5ee9ff';
